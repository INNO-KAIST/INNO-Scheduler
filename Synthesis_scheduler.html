          <div class="stat"><b>${c.phase === 'BOOKING' ? nAssigned : '–'}</b><span>추첨 확정 슬롯</span></div>
          <div class="stat"><b>${c.phase === 'BOOKING' ? nBooked : '–'}</b><span>실시간 예약 슬롯</span></div>
        </div>
        <div>
          ${S.user ? `<div class="flexrow">내 토큰 (이번 주): <span class="tokens">${BATCHES.map((_, i) => `<span class="tok ${i < used ? 'used' : ''}">${i < used ? '✓' : '●'}</span>`).join('')}</span> <span class="muted">${TOKENS_PER_WEEK - used}개 남음</span></div>
          <div class="muted" style="margin-top:6px">내 투표: ${myVotes.length ? myVotes.map(k => cellLabel(k)).join(', ') : '없음'}</div>`
          : '<div class="note">로그인하면 내 토큰 현황이 표시됩니다.</div>'}
        </div>
      </div>
      <p class="muted" style="margin-bottom:8px">다음 주 스케줄의 예약·취소는 <b>실시간 예약 탭</b>에서 진행하세요.</p>
      ${gridHtml('status')}
    </div>`;
  }
  const hasCurData = S.curResults || Object.keys(S.curBookings).length;
  let curNote;
  if (!S.user) curNote = '이번 주 확정 스케줄입니다. 로그인하면 빈 칸을 실시간으로 신청할 수 있습니다.';
  else if (S.curResults) curNote = '<b>빈 칸(점선)을 클릭해 즉시 신청</b>할 수 있고, <b>내 칸</b>을 클릭하면 취소됩니다 — <b>실시간 예약뿐 아니라 추첨 확정 칸도 취소 가능</b>합니다. 취소한 칸은 즉시 빈 슬롯이 되어 누구나 선착순으로 신청할 수 있습니다 (확정 취소는 되돌릴 수 없음). 이미 지난 시간대는 "종료"로 표시됩니다.';
  else curNote = '이번 주 확정 스케줄 데이터가 없어 실시간 신청이 불가합니다. (지난주 시스템 미사용)';
  return `
    <div class="card">
      <div class="flexrow" style="margin-bottom:10px"><h2 style="margin:0">일정</h2>${chips}</div>
      <h3 style="margin-top:0">이번 주 (${weekLabel(c.votingWeek)}) 확정 스케줄</h3>
      <p class="muted" style="margin-bottom:8px">${curNote}</p>
      ${hasCurData || S.user ? gridHtml('thisweek') : '<p class="muted">이번 주 확정 스케줄 데이터가 없습니다. (지난주에 시스템 미사용 또는 데이터 없음)</p>'}
    </div>`;
}
function cellLabel(key) {
  const { slot, batch } = parseCell(key);
  const sd = SLOT_DEFS.find(s => s.key === slot);
  return `${sd.label}·#${batch}`;
}

/* ---------------- 탭: 투표 ---------------- */
function renderVote() {
  const c = cycle();
  if (!S.user) return `<div class="card"><h2>사전 투표 (토큰)</h2><p class="muted">투표하려면 먼저 우측 상단에서 멤버 로그인을 해주세요.</p></div>`;
  if (c.phase !== 'VOTING') {
    return `<div class="card"><h2>사전 투표 (토큰)</h2>
      <p class="muted">지금은 투표 기간이 아닙니다. 투표는 <b>매주 월요일 00:00 ~ 수요일 24:00</b>에 진행됩니다.
      다음 투표 시작: <b>${fmtDT(weekStartMs(c.votingWeek + 1))}</b></p>
      ${S.votes[S.user.id]?.length ? `<div class="note">이번 주 내 투표(마감됨): ${(S.votes[S.user.id]).map(cellLabel).join(', ')}</div>` : ''}</div>`;
  }
  if (S.pendingCells === null) S.pendingCells = [...(S.votes[S.user.id] || [])];
  const pending = S.pendingCells;
  const saved = JSON.stringify([...(S.votes[S.user.id] || [])].sort()) === JSON.stringify([...pending].sort());
  const err = validateVoteSet(pending);
  return `<div class="card">
    <h2>사전 투표 (토큰) — ${weekLabel(c.targetWeek)} 대상</h2>
    <div class="flexrow" style="margin-bottom:8px">
      <span>남은 토큰:</span>
      <span class="tokens">${BATCHES.map((_, i) => `<span class="tok ${i < pending.length ? 'used' : ''}">${i < pending.length ? '✓' : '●'}</span>`).join('')}</span>
      <b>${TOKENS_PER_WEEK - pending.length}개</b>
      <span style="margin-left:auto" class="${saved ? 'muted' : 'verify-bad'}">${saved ? '저장됨 ✓' : '변경사항 있음 — 저장 필요!'}</span>
    </div>
    <p class="muted" style="margin-bottom:8px">원하는 칸을 눌러 토큰을 배치하세요. 같은 시간표에 2개 이상 배치하면 그 시간표에서 <b>우선권</b>을 가지며, <b>묶음(전부 당첨 또는 전부 탈락)</b>으로 처리됩니다. Day 시간대는 주당 최대 2배치까지만 배정됩니다.</p>
    ${err ? `<div class="note" style="color:var(--red)">⚠ ${err}</div>` : ''}
    ${gridHtml('vote')}
    <div class="flexrow" style="margin-top:14px">
      <button class="btn primary" id="btnSaveVotes" ${err || saved ? 'disabled' : ''}>투표 저장</button>
      <button class="btn" id="btnResetVotes">저장된 상태로 되돌리기</button>
      <button class="btn danger" id="btnClearVotes">투표 전체 취소</button>
      <span class="muted">마감: ${fmtDT(c.voteClose)} (수요일 24시)</span>
    </div></div>`;
}

/* ---------------- 탭: 예약 ---------------- */
function renderBook() {
  const c = cycle();
  if (c.phase !== 'BOOKING') {
    return `<div class="card"><h2>실시간 예약</h2><p class="muted">예약은 <b>목요일 12:00 추첨 발표 직후</b>부터 가능합니다. 오픈까지: <span class="countdown" data-target="${c.announce}">${fmtDur(c.announce - now())}</span></p></div>`;
  }
  if (!S.user) return `<div class="card"><h2>실시간 예약</h2><p class="muted">예약하려면 먼저 로그인해주세요.</p></div>`;
  const inPrio = inPriorityWindow(c);
  const amPrio = S.results?.priorityMembers?.includes(S.user.id);
  let banner = '';
  if (inPrio) {
    banner = amPrio
      ? `<div class="prio-banner">🎗 회원님은 <b>Day 우선예약 대상자</b>입니다. ${fmtDT(priorityWindowEnd(c))}까지 우선적으로 예약할 수 있습니다.</div>`
      : `<div class="prio-banner">지금은 <b>Day 탈락자 우선예약 시간</b>입니다 (${fmtDT(priorityWindowEnd(c))}까지). 대상자: ${(S.results?.priorityMembers || []).map(m => esc(memberName(m))).join(', ')}. 이후 전체 오픈됩니다.</div>`;
  }
  const myBookings = Object.entries(S.bookings).filter(([, b]) => b.memberId === S.user.id).map(([k]) => k);
  const dayCapNote = S.config.bookingDayCapEnabled ? `<div class="note">이 연구실 설정: 선착순 예약 단계에도 Day 주간 2배치 제한이 적용됩니다.</div>` : '';
  return `${banner}<div class="card">
    <h2>실시간 예약 — ${weekLabel(c.targetWeek)} 대상</h2>
    <p class="muted">빈 슬롯(점선)을 누르면 즉시 예약됩니다. 예약은 서버에서 원자적으로 처리되어 정확히 선착순이 보장됩니다. <b>내 예약 칸</b> 또는 <b>내 추첨 확정 칸</b>을 누르면 취소할 수 있습니다 (확정 취소는 권리 상실 — 되돌릴 수 없음).</p>
    ${dayCapNote}
    ${gridHtml('book')}
    <h3>내 예약 (${myBookings.length}건)</h3>
    <p class="muted">${myBookings.length ? myBookings.map(cellLabel).join(', ') : '아직 없습니다.'}</p>
  </div>`;
}

/* ---------------- 탭: 결과 ---------------- */
function renderResults() {
  const c = cycle();
  const weekOpts = [];
  for (let w = c.targetWeek; w >= c.targetWeek - 8; w--) weekOpts.push(w);
  const sel = S.resultsWeek ?? c.targetWeek;
  const isCurrent = sel === c.targetWeek;
  const data = isCurrent ? { results: S.results, votes: S.votes, bookings: S.bookings, cancels: S.cancels } : S.histCache[sel];
  let body = '';
  if (!isCurrent && !data) {
    body = '<p class="muted">불러오는 중...</p>';
    store.loadHistory(sel).then(async d => {
      let verify = null;
      if (d.results) { try { verify = await store.verifyResults(sel, d.results); } catch (e) {} }
      S.histCache[sel] = { ...d, verify }; render();
    }).catch(() => { S.histCache[sel] = { results: null, votes: {}, bookings: {}, failed: true }; render(); });
  } else if (!data?.results) {
    body = isCurrent && c.phase !== 'BOOKING'
      ? `<p class="muted">추첨 발표 전입니다. 발표: <b>${fmtDT(c.announce)}</b> (목요일 12:00). 발표 즉시 이 화면에 자동 표시됩니다.</p>`
      : '<p class="muted">해당 주차의 추첨 결과 데이터가 없습니다.</p>';
  } else {
    const r = data.results;
    const verify = isCurrent ? S.verify : data.verify && { ok: data.verify.ok };
    const vbadge = verify == null ? '<span class="badge b-gray">검증 중...</span>'
      : verify.ok ? '<span class="badge b-green">✓ 검증 완료 — 투표 데이터로부터 재계산한 결과와 일치</span>'
      : '<span class="badge b-red">⚠ 검증 불일치 — 관리자에게 결과 재생성을 요청하세요</span>';
    const cxl = data.cancels || {};
    const rows = Object.entries(r.assignments || {}).sort().map(([k, m]) =>
      `<tr><td>${cellLabel(k)}</td><td><b style="${cxl[k] ? 'text-decoration:line-through;opacity:.55' : ''}">${esc(memberName(m))}</b></td>
       <td>${cxl[k] ? '<span class="badge b-red">확정 취소됨 (권리 상실)</span>' : '<span class="badge b-accent">추첨</span>'}</td></tr>`).join('');
    const brows = Object.entries(data.bookings || {}).sort().map(([k, b]) =>
      `<tr><td>${cellLabel(k)}</td><td><b>${esc(memberName(b.memberId))}</b></td><td><span class="badge b-green">실시간 예약</span></td></tr>`).join('');
    body = `
      <div class="flexrow" style="margin-bottom:10px">${vbadge}</div>
      <h3>추첨 배정 (${Object.keys(r.assignments || {}).length}건)</h3>
      ${rows ? `<table class="list"><tr><th>슬롯</th><th>배정자</th><th>방식</th></tr>${rows}</table>` : '<p class="muted">추첨 배정 없음 (투표 없음)</p>'}
      <h3>실시간 예약 (${Object.keys(data.bookings || {}).length}건)</h3>
      ${brows ? `<table class="list"><tr><th>슬롯</th><th>예약자</th><th>방식</th></tr>${brows}</table>` : '<p class="muted">아직 없음</p>'}
      <h3>Day 우선예약 대상자</h3>
      <p class="muted">${(r.priorityMembers || []).length ? r.priorityMembers.map(m => esc(memberName(m))).join(', ') : '없음'}</p>
      <h3>공정성 증빙</h3>
      <p class="muted" style="word-break:break-all">추첨 시드(전체 투표 데이터의 SHA-256): <code class="k">${esc(r.seed || '')}</code><br>
      시드는 마감된 투표 내용 자체로부터 결정되므로 누구도(관리자 포함) 추첨 결과를 조작하거나 미리 알 수 없으며, 모든 접속자의 브라우저가 결과를 독립적으로 재계산하여 위 배지로 일치 여부를 표시합니다.</p>`;
  }
  return `<div class="card">
    <div class="flexrow"><h2 style="margin:0">투표 결과</h2>
      <select id="selWeek" style="margin-left:auto;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-family:inherit">
        ${weekOpts.map(w => `<option value="${w}" ${w === sel ? 'selected' : ''}>${weekLabel(w)}${w === c.targetWeek ? ' (다음 주)' : w === c.votingWeek ? ' (이번 주)' : ''}</option>`).join('')}
      </select></div>
    <div style="margin-top:10px">${body}</div></div>`;
}

/* ---------------- 탭: 명단 ---------------- */
const MEMBER_APP = 'wss';   // 이 앱이 합성(wss)인지 광학(wos)인지 — 새 멤버 기본 참여에만 쓰임
/* =====================================================================
 * 명단 관리 (관리자, «명단» 탭) — 합성·광학 두 앱이 같은 members 컬렉션을 쓰므로
 * 이 블록은 두 앱에 '글자 그대로 같은 코드'로 들어간다. 앱별 차이는 MEMBER_APP 하나.
 *   합성 참여 = active === true(구버전 문서는 필드 없음=참여)   광학 참여 = opticsActive === true
 *   삭제 = '숨김': hidden:true + 두 참여 끔 + 기기 연결 해제. 로그인·투표·예약·명단에서
 *          빠지고 서버 권한도 사라지지만(규칙이 참여·기기로 판정), 과거 배정·예약·기록의
 *          이름은 그대로 남는다. «삭제한 멤버»에서 되살릴 수 있다(PIN 은 유지).
 *   Slack ID = 봇의 리마인드·발표 태그용. 비어 있으면 봇 코드의 이름 기준 표(SLACK_MENTION)를
 *          쓰므로, 이름을 바꿀 땐 Slack ID 를 채워 두는 게 안전하다.
 * ===================================================================== */
const MEMBER_SLACK_RE = /^[UW][A-Z0-9]{6,}$/;
const memSynthOn = m => m.active !== false;
const memOpticsOn = m => m.opticsActive === true;
const memByName = (a, b) => a.name.localeCompare(b.name, 'ko');
/* 숨기지 않았고 어느 한쪽이라도 참여 중인 관리자 수 (exceptId 제외) — 잠금 방지용 */
function memAdminCount(exceptId) {
  return Object.values(S.members).filter(x => x.isAdmin && !x.hidden && x.id !== exceptId
    && (memSynthOn(x) || memOpticsOn(x))).length;
}
function memberAdminHtml() {
  const all = Object.values(S.members).sort(memByName);
  const vis = all.filter(m => !m.hidden), hid = all.filter(m => m.hidden);
  const chip = (on, label) => on ? `<span class="badge b-green">${label}</span>` : `<span class="badge b-gray">${label} 꺼짐</span>`;
  const rows = vis.map(m => `<tr>
    <td><b>${esc(m.name)}</b>${m.isAdmin ? ' <span class="badge b-violet">관리자</span>' : ''}${m.id === S.user?.id ? ' <span class="muted">(나)</span>' : ''}</td>
    <td>${chip(memSynthOn(m), '합성')} ${chip(memOpticsOn(m), '광학')}</td>
    <td>${m.slackId ? `<code class="memslack">${esc(m.slackId)}</code>` : '<span class="muted">—</span>'}</td>
    <td>${m.pinHash ? 'PIN 등록' : '<span class="badge b-amber">PIN 미등록</span>'} · 기기 ${(m.uids || []).length}대</td>
    <td class="memacts">
      <button class="btn sm" data-mem="edit" data-id="${m.id}">편집</button>
      <button class="btn sm" data-mem="pin" data-id="${m.id}">PIN 초기화</button>
      <button class="btn sm" data-mem="dev" data-id="${m.id}">기기 초기화</button>
      <button class="btn sm danger" data-mem="hide" data-id="${m.id}">삭제</button>
    </td></tr>`).join('');
  const hidRows = hid.map(m => `<tr>
    <td><b>${esc(m.name)}</b></td>
    <td class="muted">${m.slackId ? esc(m.slackId) : '—'}</td>
    <td style="white-space:nowrap"><button class="btn sm" data-mem="restore" data-id="${m.id}">되살리기</button></td></tr>`).join('');
  return `<div class="card"><h2>명단 관리 <span class="badge b-violet">관리자</span></h2>
    <p class="muted" style="margin:4px 0 12px">합성·광학 두 앱이 같은 명단을 씁니다. 여기서 바꾸면 양쪽에 바로 반영됩니다.
      새 멤버는 첫 로그인 때 본인 PIN을 등록합니다.</p>
    <div class="flexrow" style="margin-bottom:12px"><button class="btn primary" data-mem="add">+ 멤버 추가</button>
      <span class="muted">참여 중 ${vis.filter(m => memSynthOn(m) || memOpticsOn(m)).length}명 · 합성 ${vis.filter(memSynthOn).length} · 광학 ${vis.filter(memOpticsOn).length}</span></div>
    <table class="list"><tr><th>이름</th><th>참여</th><th>Slack ID</th><th>계정</th><th>조치</th></tr>${rows || '<tr><td colspan="5" class="muted">아직 등록된 멤버가 없습니다.</td></tr>'}</table>
    ${hid.length ? `<details class="memhidden"><summary>삭제한 멤버 ${hid.length}명</summary>
      <table class="list"><tr><th>이름</th><th>Slack ID</th><th>조치</th></tr>${hidRows}</table></details>` : ''}
    <div class="note">삭제는 '숨김'입니다 — 명단·로그인·투표·예약에서 빠지고 연결 기기가 해제되지만, 과거 배정·예약·기록의 이름은 그대로 남고 언제든 되살릴 수 있습니다.
      Slack ID는 봇의 리마인드·발표 태그에 쓰입니다 (Slack 프로필 → ⋮ → <b>멤버 ID 복사</b>, U로 시작).</div>
  </div>`;
}
function openMemberEditor(id) {
  const m = id ? S.members[id] : null;
  const on = (v) => v ? 'checked' : '';
  const synth = m ? memSynthOn(m) : MEMBER_APP === 'wss';
  const optics = m ? memOpticsOn(m) : MEMBER_APP === 'wos';
  const box = 'style="width:auto;margin:0"';
  showModal(`<h2>${m ? '멤버 편집' : '멤버 추가'}</h2>
    <div class="field"><label for="memName">이름</label><input id="memName" maxlength="40" autocomplete="off" value="${m ? esc(m.name) : ''}"></div>
    <div class="field"><label for="memSlack">Slack 멤버 ID <span style="font-weight:400">(선택 · 예: U0123ABCDEF)</span></label>
      <input id="memSlack" maxlength="20" autocomplete="off" spellcheck="false" placeholder="U…" value="${m ? esc(m.slackId || '') : ''}"></div>
    <div class="field"><label>참여·권한</label>
      <label class="memchk"><input type="checkbox" id="memSynth" ${box} ${on(synth)}> 합성 — 토큰 투표·예약</label>
      <label class="memchk"><input type="checkbox" id="memOptics" ${box} ${on(optics)}> 광학 — 요일 투표·조율·기록</label>
      <label class="memchk"><input type="checkbox" id="memAdmin" ${box} ${on(m && m.isAdmin)}> 관리자</label></div>
    <div class="flexrow" style="justify-content:flex-end;margin-top:6px">
      <button class="btn" data-close>취소</button><button class="btn primary" id="memSave">${m ? '저장' : '추가'}</button></div>`);
  $('#memSave').addEventListener('click', () => saveMemberFromEditor(id));
  $('#memName').addEventListener('keydown', e => { if (e.key === 'Enter') saveMemberFromEditor(id); });
  setTimeout(() => $('#memName')?.focus(), 0);
}
async function saveMemberFromEditor(id) {
  const m = id ? S.members[id] : null;
  const name = $('#memName').value.trim().replace(/\s+/g, ' ');
  const slackId = $('#memSlack').value.trim().toUpperCase();
  const active = $('#memSynth').checked, opticsActive = $('#memOptics').checked, isAdmin = $('#memAdmin').checked;
  if (!name) return toast('이름을 입력하세요.', 'err');
  if (name.length > 40) return toast('이름은 40자 이내로 입력하세요.', 'err');
  const dup = Object.values(S.members).find(x => x.id !== id && x.name.trim() === name);
  if (dup) return toast(`'${name}' 이름이 이미 있습니다${dup.hidden ? ' (삭제한 멤버 목록에서 되살릴 수 있습니다)' : ''}.`, 'err');
  if (slackId && !MEMBER_SLACK_RE.test(slackId)) return toast('Slack 멤버 ID 형식이 아닙니다 (U로 시작하는 영문·숫자). Slack 프로필 → ⋮ → 멤버 ID 복사.', 'err');
  const dupS = slackId && Object.values(S.members).find(x => x.id !== id && !x.hidden && (x.slackId || '') === slackId);
  if (dupS) return toast(`이 Slack ID는 이미 ${dupS.name}에게 등록돼 있습니다.`, 'err');
  if (isAdmin && !active && !opticsActive) return toast('관리자는 합성·광학 중 하나 이상 참여해야 로그인할 수 있습니다.', 'err');
  if (m) {
    const isSelf = id === S.user?.id;
    if (isSelf && !isAdmin) return toast('본인의 관리자 권한은 해제할 수 없습니다. (잠금 방지)', 'err');
    if (isSelf && !active && !opticsActive) return toast('본인 계정의 참여를 모두 끌 수는 없습니다. (잠금 방지)', 'err');
    if (m.isAdmin && !isAdmin && memAdminCount(id) === 0) return toast('마지막 관리자입니다. 먼저 다른 멤버를 관리자로 지정하세요.', 'err');
    if (name !== m.name && !slackId && !confirm(`이름을 '${m.name}' → '${name}'(으)로 바꿉니다.\n\nSlack ID가 비어 있으면 봇의 이름 기준 태그가 끊길 수 있습니다. 그래도 저장할까요?`)) return;
  }
  const patch = { name, slackId, active, opticsActive, isAdmin };
  try {
    await store.admin.saveMember(id || null, patch);
    closeModal();
    toast(m ? `${name} 정보를 저장했습니다.` : `${name}을(를) 명단에 추가했습니다.`, 'okk');
  } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
}
function bindMemberAdmin() {
  document.querySelectorAll('[data-mem]').forEach(b => b.addEventListener('click', async () => {
    const act = b.dataset.mem, id = b.dataset.id, m = id ? S.members[id] : null, A = store.admin;
    const isSelf = id && id === S.user?.id;
    try {
      if (act === 'add') return openMemberEditor(null);
      if (act === 'edit') return openMemberEditor(id);
      if (act === 'pin' && confirm(`${m.name}의 PIN을 초기화할까요? 다음 로그인 때 새 PIN을 등록합니다.`)) { await A.resetPin(id); toast('PIN을 초기화했습니다.', 'okk'); }
      if (act === 'dev' && confirm(`${m.name}의 연결 기기를 모두 해제할까요? 다음 로그인 때 PIN으로 다시 연결합니다.`)) { await A.resetDevices(id); toast('기기 연결을 해제했습니다.', 'okk'); }
      if (act === 'hide') {
        if (isSelf) return toast('본인 계정은 삭제할 수 없습니다. (잠금 방지)', 'err');
        if (m.isAdmin) return toast('관리자는 바로 삭제할 수 없습니다. «편집»에서 관리자를 해제한 뒤 삭제하세요.', 'err');
        if (!confirm(`${m.name}을(를) 명단에서 삭제할까요?\n\n· 명단·로그인·투표·예약 대상에서 빠지고 연결 기기가 해제됩니다.\n· 과거 배정·예약·기록의 이름은 그대로 남습니다.\n· «삭제한 멤버»에서 언제든 되살릴 수 있습니다.`)) return;
        await A.saveMember(id, { hidden: true, active: false, opticsActive: false, uids: [] });
        toast(`${m.name}을(를) 삭제했습니다. (되살리기 가능)`, 'okk');
      }
      if (act === 'restore') {
        await A.saveMember(id, { hidden: false });
        toast(`${m.name}을(를) 되살렸습니다. 참여할 앱을 켜 주세요.`, 'okk');
        openMemberEditor(id);
      }
    } catch (e) { toast(e.message, 'err'); }
  }));
}

  if (S.user?.isAdmin) return memberAdminHtml();

function renderRulesEn() {
  return `<div class="card rules"><h2>📖 Rules and Internal Process</h2>

  <div class="note" style="border:1.5px solid var(--red);background:var(--red-soft);color:var(--risk);font-size:14px">
    <b>⚠ Most important</b> — If you can no longer use time you've secured (lottery-confirmed or live booking),
    <b>cancel it yourself in the system as soon as possible</b> so other members can use it.
    (Next week: «Live booking» tab; <b>this week: «Schedule» tab (this-week view)</b> — click your cell → Cancel.
    Leaving it unused costs the whole lab equipment uptime.)
  </div>

  <h3>1. Tokens</h3>
  <ul>
    <li>Each member on the 'Roster' receives <b>4 tokens every week</b>.</li>
    <li>Reset automatically every <b>Monday 00:00 (KST)</b>. Unused tokens don't carry over.</li>
    <li>1 token = one application for one cell [day + time slot + batch].</li>
  </ul>

  <h3>2. Timetable structure</h3>
  <ul>
    <li><b>[Day]</b> Mon/Tue/Wed/Thu 06:00–18:00 (4 slots, one per day)</li>
    <li><b>[Night]</b> Mon/Tue/Wed/Thu 18:00–06:00 next day (4 slots, one per day)</li>
    <li><b>[Weekend]</b> Fri/Sat/Sun (3 slots, one per day)</li>
    <li>Each slot is split into synthesis batches <b>#1 / #2 / #3 / #4</b> → 44 cells per week.</li>
  </ul>

  <h3>3. Weekly cycle (all times KST, enforced by the server)</h3>
  <ul>
    <li><b>Mon 00:00 – Wed 24:00</b> — Pre-vote (tokens). Edit or cancel freely during this period.</li>
    <li><b>Thu 00:00</b> — Voting closes. Vote data is then permanently frozen by server rules.</li>
    <li><b>Thu 12:00</b> — Lottery results announced automatically + priority booking starts.</li>
    <li><b>After priority booking – Sunday 24:00 of the target week</b> — first-come booking for everyone.</li>
    <li>Voting, lottery and booking all target <b>next week's (Mon–Sun) schedule</b>.</li>
  </ul>

  <h3>4. Lottery rules (Thu 12:00)</h3>
  <ul>
    <li>(1) Each batch of each slot goes to <b>exactly one person</b>. Random draw on conflict.</li>
    <li>(2) <b>Day slots: at most 2 batches per person per week</b>.</li>
    <li>(3) Someone who voted for <b>2 or more different batches in the same slot (bundle vote) has priority</b>. If 2+ such people overlap on any batch, they draw randomly among themselves.</li>
    <li>(4) Bundle votes are <b>all-or-nothing</b>: all batches in that slot are assigned or none are (never partially confirmed).</li>
    <li>Order: slots are processed in a fixed order (Day Mon→Thu, Night Mon→Thu, Weekend Fri→Sun); in each slot, ① bundle votes (assigned in random order) → ② single votes (random draw per batch).</li>
    <li>Derived rule: a bundle of 3+ batches in one Day slot can never win under rules (2)+(4), so <b>such votes are blocked</b>.</li>
  </ul>

  <h3>5. How randomness and fairness are guaranteed</h3>
  <ul>
    <li>Lottery seed = <b>SHA-256 hash of all closed vote data</b>. The result is determined only by the votes.</li>
    <li>Nobody knows the final set of votes before the deadline, so the seed can't be predicted or manipulated.</li>
    <li>Every visitor's browser <b>independently re-computes and verifies</b> the result with the same algorithm; a warning badge appears if it differs from the posted result.</li>
    <li>Result documents can't be modified after creation (server rules). Only on a mismatch does an admin delete and regenerate them.</li>
  </ul>

  <h3>6. Live booking (after Thu 12:00)</h3>
  <ul>
    <li>After the lottery, open cells can be booked in real time with <b>no per-person limit</b>.</li>
    <li><b>Cancelling a lottery-confirmed cell</b>: you can cancel a cell you won in the lottery by clicking it on the Live booking tab.</li>
    <li>Cancelling a lottery-confirmed cell <b>forfeits the right immediately and permanently</b> (cannot be restored); the cell becomes an open slot anyone can book. Tokens used are not returned.</li>
    <li><b>Priority booking</b>: members who spent at least 1 token on Day but weren't selected for any Day slot can book <b>exclusively</b> for a set time right after the announcement (default 60 min, set by admins). Then it opens to everyone.</li>
    <li>Bookings are processed atomically on the server — if several people click at once, exactly one succeeds.</li>
    <li>You can cancel your own booking (the cell becomes open immediately).</li>
    <li><b>Live claims this week</b>: open cells in this week's confirmed schedule can also be claimed first-come in the <b>Schedule tab (this-week view)</b> (until Sunday 24:00 of that week, excluding ended times).</li>
    <li><b>Cancelling your cells this week</b>: in the Schedule tab (this-week view) you can cancel <b>not only your live bookings but also lottery-confirmed cells</b>. A cancelled cell becomes open immediately and <b>anyone can claim it first-come</b>. Cancelling a lottery confirmation, as for next week, <b>forfeits the right permanently</b> and can't be undone (tokens not returned). Times that have ended can't be cancelled.</li>
    <li>Whether the 2-batch Day limit also applies at booking is set by admins per lab policy (default: off).</li>
    <li><b>Admin actions</b>: for no-show cleanup and proxy adjustments, admins can manage every cell on the Live booking tab — book on behalf of any member, cancel others' bookings, cancel others' lottery confirmations (forfeit). Admin actions are not restricted by the priority window.</li>
    <li>The shared Google Calendar mirrors this system (auto-sync within 1 minute), so <b>never edit the calendar directly — always adjust in the app</b> (manual calendar edits are reverted automatically).</li>
  </ul>

  <h3>7. Safeguards against abuse and errors</h3>
  <ul>
    <li><b>Clock tampering</b> → all deadlines and opening times are enforced by the server (Firestore Security Rules) using server time, independent of the client clock.</li>
    <li><b>Excess/duplicate token votes</b> → each person's vote is stored as a single document, and server rules check the count (≤4), valid slots and identity.</li>
    <li><b>Impersonation</b> → per-member PIN + device binding. Only verified devices can write as that member. If lost, an admin resets the device/PIN.</li>
    <li><b>Editing votes after the deadline</b> → server rules reject all writes outside the time window. Vote data is frozen permanently for later verification.</li>
    <li><b>Lottery manipulation</b> → seed fixed to the hash of vote data + verification by everyone + result documents immutable.</li>
    <li><b>Booking races / double assignment</b> → one unique document per slot (atomic create) makes double booking structurally impossible.</li>
    <li><b>Forged or abusive confirmation cancellations</b> → server rules allow cancelling only cells assigned to you, and cancellation records can't be modified or deleted (except by admins). The original lottery results are preserved, so fairness verification is unaffected.</li>
    <li><b>Booking into lottery-confirmed slots</b> → server rules reject bookings on lottery-assigned cells.</li>
    <li><b>Jumping the priority window</b> → server rules reject bookings by non-eligible members during the priority window.</li>
    <li><b>Known limits (assumes trust within the lab)</b>: ① an account that hasn't logged in for the first time can be claimed by an insider until then, so <b>log in (register your PIN) right after being added</b>. ② The Day-limit-at-booking toggle is enforced only in the UI (server aggregation limits).</li>
  </ul>

  <h3>8. Operating interpretations (decided where the original rules were silent)</h3>
  <ul>
    <li>Voting (Mon–Wed) and the announcement (Thu 12:00) target <b>next week's schedule</b>.</li>
    <li>Weekend treats Fri, Sat and Sun each as an independent slot.</li>
    <li>Priority booking duration: 60 min by default (adjustable by admins).</li>
    <li>In weeks with no priority-eligible members, booking opens to everyone immediately.</li>
    <li>Unbooked open slots can still be booked during the target week (until Sunday 24:00).</li>
  </ul>
  </div>`;
}

    <li><b>우선예약</b>: Day에 토큰을 1개 이상 냈으나 Day에 한 번도 선정되지 못한 인원은 발표 직후 일정 시간(기본 60분, 관리자 설정) 동안 <b>단독으로</b> 예약 가능. 그 후 전체 오픈.</li>
    <li>예약은 서버에서 원자적으로 처리 — 동시에 눌러도 정확히 1명만 성공.</li>
    <li>본인 예약은 본인이 취소 가능 (취소 즉시 빈 슬롯으로 전환).</li>
    <li><b>이번 주 실시간 신청</b>: 이미 확정된 이번 주 스케줄의 빈 칸도 <b>일정 탭(이번 주 보기)</b>에서 실시간 선착순 신청 가능 (해당 주 일요일 24시까지, 종료된 시간대 제외).</li>
    <li><b>이번 주 내 칸 취소</b>: 일정 탭(이번 주 보기)에서 <b>본인의 실시간 예약뿐 아니라 추첨 확정 칸도 취소</b>할 수 있음. 취소한 칸은 즉시 빈 슬롯으로 전환되어 <b>전원이 선착순으로 신청</b> 가능. 추첨 확정 취소는 다음 주와 마찬가지로 <b>권리가 영구히 상실</b>되며 되돌릴 수 없음(토큰 미반환). 이미 종료된 시간대는 취소 불가.</li>
    <li>Day 2배치 제한의 예약 단계 적용 여부는 연구실 정책에 따라 관리자가 설정 (기본: 미적용).</li>
    <li><b>관리자 운영 조치</b>: 관리자는 실시간 예약 탭에서 노쇼 정리·대리 조정 목적으로 모든 칸을 직접 관리할 수 있음 — 임의 멤버 이름으로 대리 예약, 타인 예약 취소, 타인 추첨 확정 취소(권리 상실 처리). 관리자 조치는 우선예약 창의 제한을 받지 않음.</li>
    <li>공용 구글캘린더는 이 시스템의 상태를 그대로 따라가므로(1분 내 자동 동기화), <b>캘린더에서 직접 수정하지 말고 반드시 앱에서 조정</b>할 것 (캘린더 수동 변경은 자동으로 원상복구됨).</li>
  </ul>

  <h3>7. 편법·오류 방지책</h3>
  <ul>
    <li><b>시계 조작</b> → 모든 마감·오픈 시각은 서버(Firestore Security Rules)가 서버 시각으로 강제. 클라이언트 시계와 무관.</li>
    <li><b>토큰 초과/중복 투표</b> → 투표는 1인당 단일 문서로 저장되며 서버 규칙이 개수(≤4)·유효 슬롯·본인 여부를 검증.</li>
    <li><b>타인 사칭</b> → 멤버별 PIN + 기기 바인딩. 본인 확인된 기기만 해당 멤버로 쓰기 가능. 분실 시 관리자가 기기/PIN 초기화.</li>
    <li><b>마감 후 투표 수정</b> → 서버 규칙이 시간창 밖의 쓰기를 전면 거부. 투표 데이터는 영구 동결되어 사후 검증 가능.</li>
    <li><b>추첨 조작</b> → 시드가 투표 데이터 해시로 고정 + 전원 재검증 + 결과 문서 수정 불가.</li>
    <li><b>예약 경합/이중 배정</b> → 슬롯당 고유 문서 1개(원자적 생성)로 이중 예약이 구조적으로 불가능.</li>
    <li><b>확정 취소 위조/남용</b> → 본인이 배정받은 칸만 취소할 수 있도록 서버 규칙이 검증하며, 취소 기록은 수정·삭제 불가(관리자 제외). 추첨 결과 원본은 그대로 보존되어 공정성 검증에 영향 없음.</li>
    <li><b>추첨 확정 슬롯 침범</b> → 서버 규칙이 추첨 배정된 칸의 예약 생성을 거부.</li>
    <li><b>우선예약 새치기</b> → 우선예약 시간 중 비대상자의 예약을 서버 규칙이 거부.</li>
    <li><b>알려진 한계 (연구실 내부 신뢰 전제)</b>: ① 아직 첫 로그인을 하지 않은 계정은 그 전까지 내부자가 선점할 수 있으므로 명단 등록 후 <b>즉시 첫 로그인(PIN 등록)</b>을 권장. ② 예약 단계 Day 제한 토글은 UI에서만 강제됨(서버 집계 제한).</li>
  </ul>

  <h3>8. 운영 해석 사항 (규칙 원문에 명시되지 않아 확정한 사항)</h3>
  <ul>
    <li>투표(월~수)와 발표(목 12시)는 <b>다음 주 스케줄</b>을 대상으로 함.</li>
    <li>Weekend는 금/토/일 각각을 독립 슬롯으로 취급.</li>
    <li>우선예약 지속 시간: 기본 60분 (관리자 조정 가능).</li>
    <li>우선예약 대상자가 없는 주에는 즉시 전체 오픈.</li>
    <li>미예약 빈 슬롯은 대상 주 중에도 계속 예약 가능 (일요일 24시까지).</li>
  </ul>
  </div>`;
}

/* ---------------- 로그인/부트스트랩 모달 ---------------- */
function openLogin() {
  const actives = Object.values(S.members).filter(m => !m.hidden && m.active !== false);
  if (!actives.length) { openBootstrap(); return; }
  const opts = actives.sort((a, b) => a.name.localeCompare(b.name, 'ko'))
    .map(m => `<option value="${m.id}">${esc(m.name)}${m.pinHash ? '' : ' (첫 로그인)'}</option>`).join('');
  showModal(`
    <h2>멤버 로그인</h2>
    <p class="muted" style="margin-bottom:10px">Optics Scheduler와 같은 계정(이름+PIN)입니다.</p>
    <div class="field"><label>이름</label><select id="loginMember">${opts}</select></div>
    <div class="field"><label>PIN (숫자 4자리 이상)</label><input id="loginPin" type="password" inputmode="numeric" placeholder="처음이면 여기서 입력한 PIN이 등록됩니다"></div>
    <div class="flexrow"><button class="btn primary" id="btnDoLogin">로그인</button><button class="btn" data-close>취소</button></div>
    <p class="muted" style="margin-top:10px">⚠ 첫 로그인 시 입력한 PIN이 그대로 등록되니 신중히 입력하세요. PIN 분실 시 관리자에게 초기화를 요청하세요.</p>`);
  $('#btnDoLogin').addEventListener('click', async () => {
    const id = $('#loginMember').value, pin = $('#loginPin').value.trim();
    if (pin.length < 4) return toast('PIN은 4자리 이상이어야 합니다.', 'err');
    try { await store.claim(id, pin); closeModal(); toast(`${memberName(id)}님, 환영합니다!`, 'okk'); }
    catch (e) { toast(e.message, 'err'); }
  });
}
function openBootstrap() {
  showModal(`
    <h2>초기 설정 — 첫 관리자 등록</h2>
    <p class="muted" style="margin-bottom:10px">아직 명단이 비어 있습니다. 이 시스템의 첫 관리자를 등록하세요. 이후 관리자 탭에서 멤버를 추가할 수 있습니다.</p>
    <div class="field"><label>이름</label><input id="bsName" placeholder="예: 홍길동"></div>
    <div class="field"><label>PIN (숫자 4자리 이상)</label><input id="bsPin" type="password" inputmode="numeric"></div>
    <div class="flexrow"><button class="btn primary" id="btnDoBs">관리자로 시작</button><button class="btn" data-close>취소</button></div>`);
  $('#btnDoBs').addEventListener('click', async () => {
    const name = $('#bsName').value.trim(), pin = $('#bsPin').value.trim();
    if (!name) return toast('이름을 입력하세요.', 'err');
    if (pin.length < 4) return toast('PIN은 4자리 이상이어야 합니다.', 'err');
    try { await store.admin.bootstrap(name, pin); closeModal(); toast('관리자 등록 완료!', 'okk'); }
    catch (e) { toast(e.message, 'err'); }

}
function openAdminBook(cellKey, week) {
  const w = week ?? cycle().targetWeek;
  const actives = Object.values(S.members).filter(m => !m.hidden && m.active !== false)
    .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  showModal(`
    <h2>예약 — ${esc(cellLabel(cellKey))}${w === cycle().votingWeek ? ' (이번 주)' : ''}</h2>
    <p class="muted" style="margin-bottom:10px">관리자 권한으로 예약합니다. 본인 또는 다른 멤버를 지정할 수 있습니다.</p>
    <div class="field"><label>예약자</label><select id="adminBookMember">
      ${actives.map(m => `<option value="${m.id}" ${m.id === S.user.id ? 'selected' : ''}>${esc(m.name)}${m.id === S.user.id ? ' (본인)' : ''}</option>`).join('')}
    </select></div>
    <div class="flexrow"><button class="btn primary" id="btnAdminBook">예약</button><button class="btn" data-close>취소</button></div>`);
  document.querySelector('#btnAdminBook').addEventListener('click', async () => {
    const mid = document.querySelector('#adminBookMember').value;
    try {
      await store.book(cellKey, mid, w);
      closeModal();
      toast(`${memberName(mid)}님 이름으로 예약되었습니다. (캘린더에 곧 반영)`, 'okk');
    } catch (e) { toast(/permission|exist/i.test(e.message) ? '방금 다른 예약이 먼저 들어갔습니다.' : '예약 실패: ' + e.message, 'err'); }
  });
}
function showModal(html) {
  $('#modalRoot').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`;
  $('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
}
function closeModal() { $('#modalRoot').innerHTML = ''; }

/* ---------------- 메인 이벤트 바인딩 ---------------- */
function bindMain() {
  // 투표 셀 토글
  document.querySelectorAll('[data-act="togglevote"]').forEach(td => td.addEventListener('click', () => {
    const key = td.dataset.cell;
    const p = S.pendingCells || [];
    if (p.includes(key)) S.pendingCells = p.filter(k => k !== key);
    else {
      if (p.length >= TOKENS_PER_WEEK) return toast(`토큰은 주당 ${TOKENS_PER_WEEK}개까지입니다.`, 'err');
      const next = [...p, key];
      const err = validateVoteSet(next);
      if (err) return toast(err, 'err');
      S.pendingCells = next;
    }
    render();
  }));
  $('#btnSaveVotes')?.addEventListener('click', async () => {
    const err = validateVoteSet(S.pendingCells || []);
    if (err) return toast(err, 'err');
    try {
      if ((S.pendingCells || []).length === 0) await store.deleteVotes();
      else await store.saveVotes(S.pendingCells);
      toast('투표가 저장되었습니다.', 'okk');
    } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
  });
  $('#btnResetVotes')?.addEventListener('click', () => { S.pendingCells = [...(S.votes[S.user.id] || [])]; render(); });
  $('#btnClearVotes')?.addEventListener('click', async () => {
    if (!confirm('이번 주 투표를 전부 취소할까요? 토큰이 반환됩니다.')) return;
    try {
      if ((S.votes[S.user.id] || []).length) await store.deleteVotes();
      S.pendingCells = []; render(); toast('투표가 취소되었습니다.', 'okk');
    } catch (e) { toast(e.message, 'err'); }
  });

  // 예약/취소
  document.querySelectorAll('[data-act="book"]').forEach(td => td.addEventListener('click', async () => {
    const key = td.dataset.cell;
    const c = cycle();
    const week = td.dataset.week ? parseInt(td.dataset.week, 10) : c.targetWeek;
    const isCur = week === c.votingWeek;
    if (S.user.isAdmin) { openAdminBook(key, week); return; } // 관리자: 우선창 제한 없이 대리 예약 모달
    if (!isCur) { // 우선예약 창·Day 상한은 다음 주 예약 단계에만 적용
      if (inPriorityWindow(c) && !S.results?.priorityMembers?.includes(S.user.id))
        return toast('지금은 Day 탈락자 우선예약 시간입니다. 잠시 후 전체 오픈됩니다.', 'err');
      if (S.config.bookingDayCapEnabled && isDaySlot(parseCell(key).slot)) {
        const lotteryDay = Object.entries(S.results?.assignments || {}).filter(([k, m]) => m === S.user.id && isDaySlot(parseCell(k).slot) && !S.cancels[k]).length;
        const bookedDay = Object.entries(S.bookings).filter(([k, b]) => b.memberId === S.user.id && isDaySlot(parseCell(k).slot)).length;
        if (lotteryDay + bookedDay >= DAY_CAP) return toast('Day 시간대는 주당 최대 2배치까지입니다 (연구실 설정).', 'err');
      }
    } else if (now() >= slotEndMs(week, parseCell(key).slot)) {
      return toast('이미 종료된 시간대입니다.', 'err');
    }
    if (!confirm(`${isCur ? '[이번 주] ' : ''}${cellLabel(key)} 슬롯을 예약할까요?`)) return;
    try { await store.book(key, null, week); toast('예약 완료!', 'okk'); }
    catch (e) { toast(/permission|exist/i.test(e.message) ? '한발 늦었습니다 — 방금 다른 분이 예약했습니다.' : '예약 실패: ' + e.message, 'err'); }
  }));
  // 관리자: 타인 예약 취소
  document.querySelectorAll('[data-act="admin-unbook"]').forEach(td => td.addEventListener('click', async () => {
    const key = td.dataset.cell, owner = td.dataset.owner;
    const week = td.dataset.week ? parseInt(td.dataset.week, 10) : cycle().targetWeek;
    if (!confirm(`[관리자 조치] ${memberName(owner)}님의 ${cellLabel(key)} 예약을 취소할까요?`)) return;
    try { await store.unbook(key, week); toast('예약이 취소되었습니다. (캘린더에 곧 반영)', 'okk'); }
    catch (e) { toast(e.message, 'err'); }
  }));
  // 관리자: 타인 추첨 확정 취소
  document.querySelectorAll('[data-act="admin-cancelwin"]').forEach(td => td.addEventListener('click', async () => {
    const key = td.dataset.cell, owner = td.dataset.owner;
    const week = td.dataset.week ? parseInt(td.dataset.week, 10) : cycle().targetWeek;
    const isCur = week === cycle().votingWeek;
    if (!confirm(`[관리자 조치] ${isCur ? '[이번 주] ' : ''}${memberName(owner)}님의 ${cellLabel(key)} 추첨 확정을 취소할까요?\n\n⚠ 권리가 영구히 상실되며 되돌릴 수 없습니다. 칸은 빈 슬롯으로 전환됩니다.`)) return;
    try { await store.cancelAssignment(key, owner, week); toast('확정이 취소되었습니다. (캘린더에 곧 반영)', 'okk'); }
    catch (e) { toast(e.message, 'err'); }
  }));
  document.querySelectorAll('[data-act="cancelwin"]').forEach(td => td.addEventListener('click', async () => {
    const key = td.dataset.cell;
    const week = td.dataset.week ? parseInt(td.dataset.week, 10) : cycle().targetWeek;
    const isCur = week === cycle().votingWeek;
    if (!confirm(`${isCur ? '[이번 주] ' : ''}${cellLabel(key)} 칸의 추첨 확정을 취소할까요?\n\n⚠ 취소 즉시 권리가 영구히 상실되며 되돌릴 수 없습니다.\n- 사용한 토큰은 반환되지 않습니다.\n- 이 칸은 빈 슬롯으로 전환되어 누구나 선착순으로 신청할 수 있게 됩니다.`)) return;
    try { await store.cancelAssignment(key, null, week); toast('추첨 확정이 취소되었습니다. 해당 칸은 선착순 신청이 가능합니다.', 'okk'); }
    catch (e) { toast('취소 실패: ' + e.message, 'err'); }
  }));
  document.querySelectorAll('[data-act="unbook"]').forEach(td => td.addEventListener('click', async () => {
    const key = td.dataset.cell;
    const week = td.dataset.week ? parseInt(td.dataset.week, 10) : cycle().targetWeek;
    if (!confirm(`${cellLabel(key)} 예약을 취소할까요?`)) return;
    try { await store.unbook(key, week); toast('예약이 취소되었습니다.', 'okk'); }
    catch (e) { toast(e.message, 'err'); }
  }));
  // 일정 탭 주차 전환
  document.querySelectorAll('[data-vw]').forEach(b => b.addEventListener('click', () => { S.viewWeek = b.dataset.vw; render(); }));

  // 결과 주차 선택

  // 명단 관리 (관리자) — «명단» 탭
  bindMemberAdmin();
  document.querySelectorAll('[data-goto-members]').forEach(b => b.addEventListener('click', () => { S.tab = 'members'; render(); }));
  $('#btnSaveCfg')?.addEventListener('click', async () => {
    const v = Math.max(0, Math.min(720, parseInt($('#cfgPrio').value, 10) || 0));
    try {
      await store.admin.saveConfig({ priorityWindowMin: v, bookingDayCapEnabled: $('#cfgDayCap').checked });
      toast('설정이 저장되었습니다.', 'okk');
    } catch (e) { toast(e.message, 'err'); }
  });
  $('#btnDelResults')?.addEventListener('click', async () => {
    if (!confirm('이번 사이클 추첨 결과를 삭제하고 재생성할까요? (결정론적이므로 투표가 같으면 동일한 결과가 나옵니다)')) return;
    try { await store.admin.deleteResults(cycle().targetWeek); S.verify = null; toast('삭제됨 — 잠시 후 자동 재생성됩니다.', 'okk'); }
    catch (e) { toast(e.message, 'err'); }
  });
}

/* ---------------- 카운트다운 틱 ---------------- */
setInterval(() => {
  document.querySelectorAll('.countdown[data-target]').forEach(el => {
    const t = parseInt(el.dataset.target, 10);
    el.textContent = fmtDur(t - now());
    if (t - now() < -2000) render(); // 국면 전환 시 전체 갱신
  });
}, 1000);

/* ---------------- 시작 ---------------- */
store = IS_DEMO ? makeDemoStore() : makeFirestoreStore();
store.start();
render();

<script>/* ════════ INNO suite UX layer (2026-09-29) ════════

     4) 토스트: aria-live 로 화면낭독기에도 전달.
     5) 앱 전환: 상단 크롬에 INNO 앱 목록 버튼.

    host.insertBefore(wrap, place || null);
    const btn = wrap.querySelector(".inno-apps-btn");
    /* 메뉴는 body 에 붙인다 — 상단 크롬이 clip-path(전체 폭 띠)라 그 안에 두면 잘린다 */
    const menu = wrap.querySelector(".inno-apps-menu");
    menu.classList.add("inno-apps-pop"); document.body.appendChild(menu);
    const set = open => {
      wrap.classList.toggle("open", open); menu.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) {
        const r = btn.getBoundingClientRect();
        menu.style.top = Math.round(r.bottom + 8) + "px";
        menu.style.right = Math.max(12, Math.round(window.innerWidth - r.right)) + "px";
        const c = menu.querySelector("a.cur") || menu.querySelector("a"); c && c.focus();
      }
    };
    btn.addEventListener("click", e => { e.stopPropagation(); set(!wrap.classList.contains("open")); });
    document.addEventListener("click", e => { if (!wrap.contains(e.target) && !menu.contains(e.target)) set(false); });
    window.addEventListener("resize", () => set(false));
    const onKey = e => {
      if (e.key === "Escape") { set(false); btn.focus(); e.stopPropagation(); }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        const it = [...menu.querySelectorAll("a")], i = it.indexOf(document.activeElement);
        it[(i + (e.key === "ArrowDown" ? 1 : -1) + it.length) % it.length].focus(); e.preventDefault();
      }
    };
    menu.addEventListener("keydown", onKey);
    wrap.addEventListener("keydown", e => { if (e.key === "Escape") { set(false); e.stopPropagation(); } if (e.key === "ArrowDown" && !wrap.classList.contains("open")) { set(true); e.preventDefault(); } });
  }

  function all() { scan(); markClickables(document); markTabs(); markLive(); buildSwitcher(); if (C.after) C.after(); }
  let pending = false;
  const mo = new MutationObserver(() => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; all(); }); });
  function start() { all(); mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style"] }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
  window.INNO_UX_API = { closeTop };
})();
</script>
</body>
