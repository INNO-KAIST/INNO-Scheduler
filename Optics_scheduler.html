/* ---------------- 셀 편집 팝업 (클릭/드래그 공통) ---------------- */
function openCellPop(weekIdx, day, s0, s1, x, y, opt) {
  document.querySelector('.cellpop')?.remove();
  const o = opt || {};
  const canEdit = o.canEdit !== false;               // 일반 조율(멤버 배정) 가능 여부
  const admEdit = !!o.admEdit;                       // 관리자 블록 지정 가능 여부
  const adm = admOf(weekIdx);
  // 선택 구간에 이미 걸려 있는 관리자 블록
  const admArr = optAdminSlotArr(adm, day);
  let hasAdm = false;
  for (let s = s0; s <= s1; s++) if (admArr[s] !== null) hasAdm = true;
  // 구간 전체가 '같은' 관리자 블록이면 현재 종류·메모를 미리 채워 그대로 수정할 수 있게 한다
  let curAdm = null;
  if (hasAdm) {
    let uniform = true;
    for (let s = s0; s <= s1; s++) if (admArr[s] !== admArr[s0]) uniform = false;
    if (uniform && admArr[s0]) curAdm = optAdminParse(admArr[s0]);
  }

  const list = Object.values(S.members).filter(m => m.opticsActive === true)
    .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  /* 선택 구간의 현재 배정(관리자 블록 제외) — 누구 칸을 바꾸는지 보여 주고, 남의 칸이면 확인 */
  const effDay = optEffectiveSchedule(calCtx(weekIdx).results || {}, calCtx(weekIdx).sched, calCtx(weekIdx).adm)[day] || [];
  const curOwners = [...new Set(effDay.slice(s0, s1 + 1).filter(v => v && !optIsAdminOwner(v)))];
  const curEmpty = effDay.slice(s0, s1 + 1).some(v => !v);
  const curLabel = curOwners.length
    ? curOwners.map(memberName).join(', ') + (curEmpty ? ' · 일부 빈 칸' : '')
    : '비어 있음';
  const div = document.createElement('div');
  div.className = 'cellpop';
  const memberOpts = canEdit ? `
      ${S.user?.optics ? `<option value="${S.user.id}"${curOwners.length === 1 && curOwners[0] !== S.user.id ? '' : ' selected'}>${esc(S.user.name)} (본인)</option>` : ''}
      ${list.filter(m => !S.user || m.id !== S.user.id).map(m => `<option value="${m.id}"${curOwners.length === 1 && curOwners[0] === m.id ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}
      <option value="">(비우기)</option>` : '';
  const admOpts = admEdit ? `<optgroup label="관리자 지정 (예약 불가 구간)">
      ${OPT_ADMIN_KINDS.map(k => `<option value="${OPT_ADMIN_MARK}${k.code}"${curAdm && curAdm.code === k.code ? ' selected' : ''}>🔒 ${esc(k.label)}</option>`).join('')}
      ${hasAdm ? '<option value="__admclear__">🔓 관리자 지정 해제</option>' : ''}
    </optgroup>` : '';
  const notice = !hasAdm ? ''
    : admEdit
      ? `<p class="muted" style="color:var(--risk);margin:0 0 8px">🔒 현재 <b>${esc(curAdm ? optAdminLabel(admArr[s0]) : '관리자 지정 일정')}</b> 구간입니다.
         종류·메모를 바꿔 저장하거나 <b>🔓 해제</b>할 수 있고, <b>멤버를 지정하거나 비우면 관리자 지정이 함께 해제</b>됩니다.</p>`
      : '<p class="muted" style="color:var(--risk);margin:0 0 8px">🔒 이 구간은 관리자 지정 일정(Repair·외부인 방문측정)입니다. 관리자만 변경할 수 있습니다.</p>';
  div.innerHTML = `
    <h4>${OPT_DAYS[day]} ${optSlotLabel(s0)} ~ ${s1 + 1 >= 48 ? '24:00' : optSlotLabel(s1 + 1)}</h4>
    ${notice}
    ${canEdit ? `<p class="muted" style="margin:0 0 8px">현재 배정: <b>${esc(curLabel)}</b></p>` : ''}
    <div class="field"><label>배정 대상</label><select id="popMember">${memberOpts}${admOpts}</select></div>
    <div class="field" id="popMemoWrap" style="display:none"><label>메모 (선택)</label>
      <input id="popMemo" maxlength="40" placeholder="예: A대 김○○ 측정" value="${esc(curAdm ? curAdm.memo : '')}"></div>
    <div class="flexrow">
      <button class="btn primary sm" id="popApply">적용</button>
      ${canEdit ? '<button class="btn sm" id="popClear">비우기</button>' : ''}
      <button class="btn sm" id="popClose">닫기</button>
    </div>`;
  document.body.appendChild(div);
  /* 메모 입력칸이 나타나면 팝업 높이가 커지므로 그때마다 위치를 다시 잡는다
   * (그렇지 않으면 '적용' 버튼이 화면 밖으로 밀려나 눌리지 않음) */
  const place = () => {
    const W = div.offsetWidth || 230, H = div.offsetHeight || 170;
    div.style.left = Math.max(6, Math.min(x, window.innerWidth - W - 10)) + 'px';
    div.style.top = Math.max(6, Math.min(y, window.innerHeight - H - 10)) + 'px';
  };
  place();

  const sel = div.querySelector('#popMember');
  const memoWrap = div.querySelector('#popMemoWrap');
  const syncMemo = () => { memoWrap.style.display = optIsAdminOwner(sel.value) ? '' : 'none'; place(); };
  sel.addEventListener('change', syncMemo); syncMemo();

  /* 일반 조율 적용.
   * 관리자 블록이 걸린 구간은 일반 멤버가 덮어쓸 수 없다.
   * 관리자는 가능하되, 블록이 최상위 레이어라 그냥 덮어쓰면 화면에 반영되지 않으므로
   * 확인 후 '관리자 지정 해제 → 배정 기록'을 한 번에 수행한다. */
  const applySched = async (mid) => {
    if (hasAdm) {
      if (!admEdit) return toast('관리자 지정 일정(Repair·외부인 방문측정) 구간은 수정할 수 없습니다. 관리자에게 요청하세요.', 'err');
      if (!confirm('이 구간에는 관리자 지정 일정(Repair·외부인 방문측정)이 있습니다.\n\n관리자 지정을 해제하고 선택한 내용으로 바꿀까요?')) return;
    }
    /* 다른 사람의 배정을 바꾸는 경우: 확인 + 조율 채팅에 기록(누가 무엇을 바꿨는지 남긴다) */
    const others = curOwners.filter(o => o !== mid && (!S.user || o !== S.user.id));
    const range = `${OPT_DAYS[day]} ${optSlotLabel(s0)}~${s1 + 1 >= 48 ? '24:00' : optSlotLabel(s1 + 1)}`;
    const toLabel = mid ? memberName(mid) : '빈 칸';
    if (others.length && !confirm(`${range} 에 배정된 ${others.map(memberName).join(', ')} 님의 시간을 「${toLabel}」(으)로 바꿉니다.\n\n조율 채팅에 변경 기록이 남습니다. 계속할까요?`)) return;
    const changes = {};
    for (let s = s0; s <= s1; s++) changes[String(s)] = mid;
    try {
      if (hasAdm) {
        const clear = {};
        for (let s = s0; s <= s1; s++) clear[String(s)] = '';
        await store.setAdminBlock(weekIdx, day, clear);
      }
      await store.setSlots(weekIdx, day, changes);
      div.remove();
      if (others.length) {
        try { await store.sendChat(`[자동 기록] ${S.user ? S.user.name : ''} — ${optDayLabel(weekIdx, day)} ${optSlotLabel(s0)}~${s1 + 1 >= 48 ? '24:00' : optSlotLabel(s1 + 1)}: ${others.map(memberName).join(', ')} → ${toLabel}`); } catch (e) {}
      }
      if (hasAdm) toast('관리자 지정을 해제하고 배정을 변경했습니다. (캘린더에 곧 반영)', 'okk');
      else toast(`${range} → ${toLabel}`, 'okk');
    } catch (e) { toast('수정 실패: ' + e.message, 'err'); }
  };
  /* 관리자 블록 지정/해제 */
  const applyAdm = async (value) => {
    const changes = {};
    for (let s = s0; s <= s1; s++) changes[String(s)] = value;
    try {
      await store.setAdminBlock(weekIdx, day, changes);
      div.remove();
      toast(value === '' ? '관리자 지정이 해제되었습니다.' : '관리자 지정 일정이 등록되었습니다. (캘린더에 곧 반영)', 'okk');
    } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
  };
  div.querySelector('#popApply').addEventListener('click', () => {
    const v = sel.value;
    if (v === '__admclear__') return applyAdm('');
    if (optIsAdminOwner(v)) {
      const p = optAdminParse(v);
      return applyAdm(optAdminOwner(p.code, div.querySelector('#popMemo').value));
    }
    applySched(v);
  });
  div.querySelector('#popClear')?.addEventListener('click', () => applySched(''));
  div.querySelector('#popClose').addEventListener('click', () => div.remove());
}

/* ── rd3 초안: '지금 할 일 + 내 시간' 카드 (Optics) ── */
function rdMyBlocks(weekIdx) {
  if (!S.user) return [];
  const ctx = calCtx(weekIdx);
  if (!ctx.results) return [];
  const eff = optEffectiveSchedule(ctx.results || {}, ctx.sched, ctx.adm);
  const out = [];
  for (let d = 0; d < 7; d++) for (const b of optMergeBlocks(eff[d])) if (b.owner === S.user.id) {
    const endMs = optDayDate(weekIdx, d) + b.end * 1800000;
    out.push({ d, start: b.start, end: b.end, h: (b.end - b.start) / 2, past: now() >= endMs });
  }
  return out;
}
function rdSlotChips(weekIdx, blocks) {
  return blocks.map(b => `<span class="${b.past ? 'past' : ''}">${OPT_DAYS[b.d]} ${fmtDate(optDayDate(weekIdx, b.d))} ${optRangeLabel(b.start, b.end)}</span>`).join('');
}
function nowCardHtml() {
  const c = cycle(), P = c.phase;
  if (!S.user) return `<div class="card nowcard"><div><h2>지금 할 일</h2>
      <div class="nowsub">로그인하면 내 투표·배정 시간이 여기 모입니다.</div></div>
      <div><button class="btn primary" data-rdlogin>멤버 로그인</button></div></div>`;
  let line = '', sub = '', act = '';
  const v = S.votes && S.votes[S.user.id];
  const nv = v ? optNormRanks(v) : null;
  const rankTxt = nv ? ['r1', 'r2', 'r3'].map((k, i) => nv[k] ? `${'①②③'[i]}${OPT_DAYS[nv[k].d]}${nv[k].q && nv[k].q.length < 4 ? ' ' + optQuartersLabel(nv[k].q) : ''}` : '').filter(Boolean).join(' ') : '';
  if (P === 'VOTING') {
    line = nv ? `사전 투표 <b>완료</b> — ${esc(rankTxt)}` : `사전 투표를 <b>아직 안 했습니다</b>`;
    sub = `마감 ${fmtDT(c.voteClose)} · 투표는 선택입니다`;
    act = `<button class="btn ${nv ? '' : 'primary'}" data-rdgo="vote">${nv ? '투표 수정' : '투표하기'}</button>`;
  } else if (P === 'WAITING') {
    line = `배정 발표 대기 — ${fmtDT(c.announce)}`;
    sub = nv ? `내 투표: ${esc(rankTxt)}` : '이번 투표에는 참여하지 않았습니다';
  } else {
    const nxt = rdMyBlocks(c.targetWeek), cur = rdMyBlocks(c.votingWeek);
    const hN = nxt.reduce((a, b) => a + b.h, 0), hC = cur.filter(b => !b.past).reduce((a, b) => a + b.h, 0);
    line = `다음 주 내 시간 <b>${hN}시간</b>` + (cur.length ? ` · 이번 주 남은 시간 <b>${hC}시간</b>` : '');
    sub = nxt.length ? `<div class="myslots">${rdSlotChips(c.targetWeek, nxt)}</div>` : '다음 주에 배정된 시간이 없습니다. 조율·채팅에서 빈 시간을 요청할 수 있습니다.';
    act = `<button class="btn" data-rdgo="coord">조율·채팅</button>`;
  }
  return `<div class="card nowcard"><div><h2>지금 할 일</h2><div class="nowline">${line}</div><div class="nowsub">${sub}</div></div><div>${act}</div></div>`;
}
/* ── rd3 초안: 휴대폰 요일별 목록 (Optics) ── */
function rdIsPhone() { return !!(window.matchMedia && window.matchMedia('(max-width:720px)').matches); }
function dayListHtml(weekIdx) {
  const ctx = calCtx(weekIdx);
  const eff = optEffectiveSchedule(ctx.results || {}, ctx.sched, ctx.adm);
  const todayIdx = Math.floor((now() - weekStartMs(weekIdx)) / DAY_MS);
  let h = '';
  for (let d = 0; d < 7; d++) {
    const blocks = optMergeBlocks(eff[d]);
    const qa = ctx.results?.quarterAssign?.[String(d)];
    const owners = qa ? [...new Set(Object.values(qa))] : (ctx.results?.dayAssign?.[String(d)] ? [ctx.results.dayAssign[String(d)]] : []);
    const rows = blocks.map(b => {
      const col = memberColor(b.owner), mine = S.user && b.owner === S.user.id;
      return `<div class="blk${mine ? ' mine' : ''}"><span class="t">${optRangeLabel(b.start, b.end)}</span>
        <span class="who" style="background:${col.bg};color:${col.fg}">${optIsAdminOwner(b.owner) ? '🔒 ' : ''}${esc(ownerLabel(b.owner))}</span>
        <span class="h">${(b.end - b.start) / 2}h</span></div>`;
    }).join('');
    h += `<div class="dayl${d === todayIdx ? ' today' : ''}"><h3>${OPT_DAYS[d]} <small>${fmtDate(optDayDate(weekIdx, d))}${owners.length ? ' · 배정 ' + esc(owners.map(memberName).join('/')) : ''}${d === todayIdx ? ' · 오늘' : ''}</small></h3>
      ${rows || '<div class="empty">비어 있음</div>'}</div>`;
  }
  return `<div class="daylist">${h}</div>`;
}
function bindRd() {
  document.querySelectorAll('[data-rdgo]').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.rdgo; render(); }));
  document.querySelectorAll('[data-rdlogin]').forEach(b => b.addEventListener('click', openLogin));
  document.querySelectorAll('[data-rdview]').forEach(b => b.addEventListener('click', () => { S.rdGrid = b.dataset.rdview === 'grid'; render(); }));
}
function bindMain() {
  bindRd();
  // 스케줄 주 선택 / 오버레이
  document.querySelectorAll('[data-vw]').forEach(b => b.addEventListener('click', () => { S.viewWeek = b.dataset.vw; render(); }));
  $('#ovToggle')?.addEventListener('change', e => { S.overlay = e.target.checked; render(); });
  $('#ovToggleCoord')?.addEventListener('change', e => { S.overlay = e.target.checked; render(); });

  // 캘린더 드래그/클릭 (Pointer Events; 터치 포함)
  // 터치에서 세로 스와이프가 화면 스크롤로 새지 않도록 CSS touch-action 으로 제스처를 분리하고
  // (표 안쪽 요일 칸 = 범위 선택 / 시간 눈금·헤더·표 바깥 = 화면 스크롤),
  // 브라우저가 제스처를 가져가는 경우(pointercancel)에는 드래그 상태를 안전하게 정리한다.
  document.querySelectorAll('.cal[data-editable="1"]').forEach(cal => {
    const weekIdx = parseInt(cal.dataset.calweek, 10);
    const popOpt = { canEdit: cal.dataset.canedit === '1', admEdit: cal.dataset.admedit === '1' };
    cal.addEventListener('pointerdown', e => {
      const cell = e.target.closest('.cell');
      if (!cell) return;
      e.preventDefault();
      S.drag = { weekIdx, day: +cell.dataset.day, s0: +cell.dataset.slot, s1: +cell.dataset.slot };
      // 포인터 캡처: 손가락/커서가 표 밖으로 나가도 드래그가 끊기지 않음
      try { cal.setPointerCapture(e.pointerId); } catch (err) {}
      updateDragSel(cal);
      showDragTip(e.clientX, e.clientY);
    });
    cal.addEventListener('pointermove', e => {
      if (!S.drag) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el?.closest?.('.cell');
      if (cell && +cell.dataset.day === S.drag.day && cell.closest('.cal') === cal) {
        S.drag.s1 = +cell.dataset.slot;
        updateDragSel(cal);
      }
      showDragTip(e.clientX, e.clientY);
    });
    cal.addEventListener('pointerup', e => {
      hideDragTip();
      if (!S.drag) return;

      updateDragSel(cal);
      const s0 = Math.min(d.s0, d.s1), s1 = Math.max(d.s0, d.s1);
      openCellPop(d.weekIdx, d.day, s0, s1, e.clientX + 6, e.clientY + 6, popOpt);
    });
    // 브라우저가 제스처를 스크롤 등으로 가져간 경우 — 팝업을 띄우지 않고 조용히 취소
    cal.addEventListener('pointercancel', () => { S.drag = null; updateDragSel(cal); hideDragTip(); });
  });
  document.addEventListener('pointerup', () => { if (S.drag) S.drag = null; hideDragTip(); }, { once: true });

  // 투표 — 요일 이름을 누르면 '종일', 시간대 칩을 누르면 그 칩만 (또는 토글)
  /* 순위는 지정 순서대로 r1→r2→r3 로 채워지고, 해제 시 아래 순위가 당겨진다. */
  const rankKeys = ['r1', 'r2', 'r3'];
  const pickedKeyOfDay = d => rankKeys.find(k => { const n = optNormRank((S.pendingRanks || {})[k]); return n && n.d === d; });
  const compact = obj => {                       // 빈 자리 없이 r1부터 다시 채움
    const vals = rankKeys.map(k => obj[k]).filter(v => v !== undefined && v !== null);
    const out = {};
    vals.forEach((v, i) => { out[rankKeys[i]] = v; });
    return out;
  };
  const setDay = (d, quarters) => {              // 지정/갱신
    const p = { ...(S.pendingRanks || {}) };
    const k = pickedKeyOfDay(d);
    if (k) { p[k] = { d, q: quarters }; S.pendingRanks = p; return true; }
    const slot = rankKeys.find(x => p[x] === undefined || p[x] === null);
    if (!slot) { toast('순위는 최대 3개까지입니다. 기존 순위를 해제 후 지정하세요.', 'err'); return false; }
    p[slot] = { d, q: quarters };
    S.pendingRanks = p;
    return true;
  };
  const clearDay = d => {
    const k = pickedKeyOfDay(d);
    if (!k) return;
    const p = { ...(S.pendingRanks || {}) };
    delete p[k];
    S.pendingRanks = compact(p);
  };
  document.querySelectorAll('[data-votday]').forEach(el => el.addEventListener('click', () => {
    const d = +el.dataset.votday;
    if (pickedKeyOfDay(d) !== undefined) clearDay(d);   // 이미 고른 요일 → 해제
    else if (!setDay(d, OPT_ALL_QUARTERS.slice())) return;
    render();
  }));
  document.querySelectorAll('[data-votq]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const [ds, qs] = el.dataset.votq.split('|');
    const d = +ds, q = +qs;
    const k = pickedKeyOfDay(d);
    if (k === undefined) { if (setDay(d, [q])) render(); return; }   // 안 고른 요일 → 그 시간대만 지원
    const cur = optNormRank(S.pendingRanks[k]).q;
    const next = cur.includes(q) ? cur.filter(x => x !== q) : cur.concat(q).sort((a, b) => a - b);
    if (!next.length) clearDay(d);                                   // 전부 해제 = 요일 해제
    else setDay(d, next);
    render();
  }));
  $('#btnSaveVote')?.addEventListener('click', async () => {
    const err = optValidateVote(S.pendingRanks || {});
    if (err) return toast(err, 'err');
    try {
      if (!Object.keys(S.pendingRanks || {}).length) {
        if ((S.votes[S.user.id] && Object.keys(S.votes[S.user.id]).length)) await store.deleteVote();
      } else await store.saveVote(S.pendingRanks);
      toast('투표가 저장되었습니다.', 'okk');
    } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
  });
  $('#btnResetVote')?.addEventListener('click', () => { S.pendingRanks = optNormRanks(S.votes[S.user.id]); render(); });
  $('#btnClearVote')?.addEventListener('click', async () => {
    if (!confirm('이번 주 순위 투표를 전부 취소할까요?')) return;
    try {
      if (S.votes[S.user.id]) await store.deleteVote();
      S.pendingRanks = {}; render(); toast('투표가 취소되었습니다.', 'okk');
    } catch (e) { toast(e.message, 'err'); }
  });

  // 채팅
  const send = async () => {
    const inp = $('#chatText');
    const text = (inp?.value || '').trim();
    if (!text) return;
    inp.value = '';
    try { await store.sendChat(text); } catch (e) { toast('전송 실패: ' + e.message, 'err'); }
  };
  $('#btnChatSend')?.addEventListener('click', send);
  $('#btnChatClear')?.addEventListener('click', async () => {
    if (!S.user?.isAdmin) return;
    if (!confirm('조율 채팅을 전체 삭제하고 백지로 초기화할까요?\n(모든 멤버에게 즉시 반영되며 되돌릴 수 없습니다)')) return;
    try { await store.clearChat(); toast('채팅이 초기화되었습니다.', 'okk'); }
    catch (e) { toast('초기화 실패: ' + e.message, 'err'); }
  });
  $('#chatText')?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) send(); });
  if (S.tab === 'coord') { const el = $('#chatlog'); if (el) el.scrollTop = el.scrollHeight; }

  // 결과 주차
  $('#selWeek')?.addEventListener('change', e => { S.resultsWeek = parseInt(e.target.value, 10); render(); });

  document.querySelectorAll('[data-hwedit]').forEach(b => b.addEventListener('click', () => { hwEdit.section = b.dataset.hwedit; render(); }));

  document.querySelectorAll('[data-hwsave]').forEach(b => b.addEventListener('click', () => saveHwSection(b.dataset.hwsave)));

    });
    cur[sec].push(sec === 'laser' ? { id: 'l' + Date.now(), band: '', controller: '', turret: '', updatedAt: 0, updatedBy: '' }
      : sec === 'turret' ? { id: 't' + Date.now(), no: '', mirror: '', updatedAt: 0, updatedBy: '' }

  }));

  $('#btnAddRemark')?.addEventListener('click', async () => {

function updateDragSel(cal) {
  cal.querySelectorAll('.cell.sel').forEach(c => c.classList.remove('sel'));
  if (!S.drag) return;
  const a = Math.min(S.drag.s0, S.drag.s1), b = Math.max(S.drag.s0, S.drag.s1);
  for (let s = a; s <= b; s++) cal.querySelector(`.cell[data-day="${S.drag.day}"][data-slot="${s}"]`)?.classList.add('sel');
}

/* 드래그 중 선택 범위 말풍선 — 모바일에서는 손가락에 칸이 가려져 이게 유일한 피드백이 된다 */
function showDragTip(x, y) {
  if (!S.drag) return hideDragTip();
  const a = Math.min(S.drag.s0, S.drag.s1), b = Math.max(S.drag.s0, S.drag.s1);
  let tip = document.querySelector('.dragtip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'dragtip'; document.body.appendChild(tip); }
  tip.textContent = `${OPT_DAYS[S.drag.day]} ${optRangeLabel(a, b + 1)} (${(b - a + 1) / 2}h)`;
  const w = tip.offsetWidth || 150, h = tip.offsetHeight || 30;
  tip.style.left = Math.max(6, Math.min(x + 14, window.innerWidth - w - 8)) + 'px';
  tip.style.top = Math.max(6, Math.min(y - h - 14, window.innerHeight - h - 8)) + 'px';
}
function hideDragTip() { document.querySelector('.dragtip')?.remove(); }

/* ---------------- 카운트다운 & 시작 ---------------- */
setInterval(() => {
  document.querySelectorAll('.countdown[data-target]').forEach(el => {
    const t = parseInt(el.dataset.target, 10);
    el.textContent = fmtDur(t - now());
    if (t - now() < -2000) render();
  });
}, 1000);

store = IS_DEMO ? makeDemoStore() : makeFirestoreStore();
store.start();
render();

<script>/* ════════ INNO suite UX layer (2026-09-29) ════════
