<script>
/* =====================================================================
 * Weekly Optics Scheduler - 광학 전용 핵심 로직
 * (core.js 의 주차계산·SHA-256·PRNG 를 그대로 사용하며, 이 파일이 뒤에 연결됨)
 * ===================================================================== */

const OPT_DAYS = ['월', '화', '수', '목', '금', '토', '일']; // dayIdx 0~6
const OPT_SLOTS_PER_DAY = 48; // 30분 단위 00:00~24:00
const OPT_MAX_RANKS = 3;

function optSlotLabel(slotIdx) {
  const h = Math.floor(slotIdx / 2), m = slotIdx % 2 ? '30' : '00';
  return String(h).padStart(2, '0') + ':' + m;
}
function optDayDate(weekIdx, dayIdx) { return weekStartMs(weekIdx) + dayIdx * DAY_MS; }
function optDayLabel(weekIdx, dayIdx) { return fmtDate(optDayDate(weekIdx, dayIdx)) + '(' + OPT_DAYS[dayIdx] + ')'; }
/* '7/16(목)' 형태 + 요일 포함 날짜 표기 (하드웨어 로그용) */
/* Remark 기록: 새 항목을 맨 앞에 추가하고 최대 max개만 유지(오래된 것 자동 삭제) */
function optPushRemark(entries, entry, max) {
  const cap = max || 10;
  const list = [entry].concat(Array.isArray(entries) ? entries : []);
  return list.slice(0, cap);
}

function optFmtDateDow(ms) {
  const dow = OPT_DAYS[(kstDayNum(ms) + 3) % 7];
  const d = new Date(ms + KST_OFFSET_MS);
  return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${String(d.getUTCDate()).padStart(2, '0')}(${dow}) ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
}

/* =====================================================================
 * 하루 4분할 (Quarter) — 투표 단위
 * Q1 새벽 00-06 / Q2 오전 06-12 / Q3 오후 12-18 / Q4 저녁 18-24
 * 30분 슬롯 기준으로 각 분기는 12칸을 차지한다 (12 × 30분 = 6시간).
 * ===================================================================== */
const OPT_QUARTERS = [
  { q: 1, key: 'Q1', label: '새벽', range: '00-06' },
  { q: 2, key: 'Q2', label: '오전', range: '06-12' },
  { q: 3, key: 'Q3', label: '오후', range: '12-18' },
  { q: 4, key: 'Q4', label: '저녁', range: '18-24' },
];
const OPT_SLOTS_PER_QUARTER = OPT_SLOTS_PER_DAY / 4; // 12
const OPT_ALL_QUARTERS = [1, 2, 3, 4];

function optQuarterLabel(q) {
  const x = OPT_QUARTERS.filter(function (o) { return o.q === q; })[0];
  return x ? x.key + ' ' + x.label + '(' + x.range + ')' : 'Q' + q;
}
/* 분기 목록 → '00-12시' 처럼 연속 구간을 합친 짧은 표기 */
function optQuartersLabel(qs) {
  const sorted = (qs || []).slice().sort(function (a, b) { return a - b; });
  if (!sorted.length) return '';
  if (sorted.length === 4) return '종일';
  const parts = [];
  let st = sorted[0], prev = sorted[0];
  for (let i = 1; i <= sorted.length; i++) {
    const cur = sorted[i];
    if (cur === prev + 1) { prev = cur; continue; }
    parts.push(String((st - 1) * 6).padStart(2, '0') + '-' + String(prev * 6).padStart(2, '0'));
    st = cur; prev = cur;
  }
  return parts.join(', ') + '시';
}

/* ---- 투표 항목 정규화 ----
 * 신형: {d: 요일idx, q: [1,2]}   구형(하위호환): 요일idx 숫자 하나 = 하루 전체
 * 반환 {d, q(정렬·중복제거된 1~4)} 또는 null */
function optNormRank(v) {
  if (v === undefined || v === null) return null;
  if (typeof v === 'number') {
    return Number.isInteger(v) && v >= 0 && v <= 6 ? { d: v, q: OPT_ALL_QUARTERS.slice() } : null;
  }
  if (typeof v !== 'object' || !Number.isInteger(v.d) || v.d < 0 || v.d > 6) return null;
  let q = Array.isArray(v.q) ? v.q : OPT_ALL_QUARTERS;
  q = q.filter(function (x) { return Number.isInteger(x) && x >= 1 && x <= 4; });
  q = q.filter(function (x, i) { return q.indexOf(x) === i; }).sort(function (a, b) { return a - b; });
  if (!q.length) return null;
  return { d: v.d, q: q };
}
/* 투표 묶음 {r1,r2,r3} 을 전부 신형 {d,q} 로 정규화 (유효하지 않은 항목은 제거).
 * 저장 직전과 편집 상태 초기화 시 반드시 통과시킬 것 — 구버전에서 저장된 숫자 형식이
 * 그대로 다시 전송되면 서버 규칙(신형 형식 검사)에 걸려 'Missing or insufficient permissions' 가 난다. */
function optNormRanks(ranks) {
  const out = {};
  ['r1', 'r2', 'r3'].forEach(function (k) {
    const n = optNormRank((ranks || {})[k]);
    if (n) out[k] = { d: n.d, q: n.q };
  });
  return out;
}
/* 분기 소유 맵 {"1":mid,…} → 48슬롯 배열 */
function optQuarterSlots(qmap) {
  const arr = new Array(OPT_SLOTS_PER_DAY).fill(null);
  for (let k = 1; k <= 4; k++) {
    const mid = (qmap || {})[String(k)];
    if (!mid) continue;
    for (let s = (k - 1) * OPT_SLOTS_PER_QUARTER; s < k * OPT_SLOTS_PER_QUARTER; s++) arr[s] = mid;
  }
  return arr;
}
/* 결과 문서 → 요일별 48슬롯 '기본 배정' 배열.
 * quarterAssign 이 있으면 분기 단위로, 없으면(구버전 결과) dayAssign 으로 하루 전체. */
function optBaseSlots(results) {
  const r = results || {};
  // dayAssign 맵을 그대로 넘겨준 옛 호출도 계속 지원 (키가 "0"~"6" 뿐이면 dayAssign 으로 간주)
  const isRawDayAssign = r.dayAssign === undefined && r.quarterAssign === undefined;
  const da = isRawDayAssign ? r : (r.dayAssign || {});
  const qa = isRawDayAssign ? null : r.quarterAssign;
  const out = {};
  for (let day = 0; day < 7; day++) {
    if (qa && qa[String(day)]) { out[day] = optQuarterSlots(qa[String(day)]); continue; }
    const mid = da[String(day)] || null;
    out[day] = new Array(OPT_SLOTS_PER_DAY).fill(mid);
  }
  return out;
}

/* =====================================================================
 * 관리자 전용 블록 (Repair / 외부인 방문측정)
 * ---------------------------------------------------------------------
 * 30분 슬롯의 '소유자' 값으로 멤버ID 대신 특수 문자열을 사용한다.
 *   형식: '!' + kind + ('|' + memo)      예) '!repair', '!visit|A대 김OO'
 * Firestore 자동생성 ID는 영숫자뿐이므로 '!' 접두는 멤버ID와 절대 충돌하지 않는다.
 * 이 값은 optEffectiveSchedule 의 '최상위 레이어'로 적용되어 추첨 배정·자유
 * 조율 결과를 모두 덮는다 → 당첨자는 관리자 블록을 제외한 나머지 시간만 사용.
 * ===================================================================== */
const OPT_ADMIN_MARK = '!';
const OPT_ADMIN_KINDS = [
  { code: 'repair', label: 'Repair' },
  { code: 'visit', label: '외부인 방문측정' },
];
function optIsAdminOwner(v) { return typeof v === 'string' && v.charAt(0) === OPT_ADMIN_MARK; }
/* 메모 정제: 캘린더 태그([WOS|…]) 및 값 구분자와 충돌하는 문자 제거 + 길이 제한 */
function optAdminMemoClean(memo) {
  return String(memo == null ? '' : memo).replace(/[\[\]|\r\n\t]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
}
function optAdminOwner(kind, memo) {
  const m = optAdminMemoClean(memo);
  return OPT_ADMIN_MARK + kind + (m ? '|' + m : '');
}
function optAdminParse(v) {
  if (!optIsAdminOwner(v)) return null;
  const body = v.slice(1);
  const i = body.indexOf('|');
  const code = i < 0 ? body : body.slice(0, i);
  const memo = i < 0 ? '' : body.slice(i + 1);
  const k = OPT_ADMIN_KINDS.filter(function (x) { return x.code === code; })[0];
  return { code: code, kind: k ? k.label : code, memo: memo };
}
function optAdminLabel(v) {
  const p = optAdminParse(v);
  return p ? p.kind + (p.memo ? ' · ' + p.memo : '') : '';
}
/* 관리자 블록 문서에서 요일별 슬롯 배열(48) 추출. '' 또는 미기재 = 블록 없음 */
function optAdminSlotArr(adminDocs, day) {
  const slots = ((adminDocs || {})[String(day)] || {}).slots || {};
  const arr = new Array(OPT_SLOTS_PER_DAY);
  for (let s = 0; s < OPT_SLOTS_PER_DAY; s++) {
    const v = slots[String(s)];
    arr[s] = (v === undefined || v === null || v === '') ? null : v;
  }
  return arr;
}
/* 요일의 관리자 블록을 연속 구간으로 병합 → [{start, end, owner}] */
function optAdminBlocksOfDay(adminDocs, day) { return optMergeBlocks(optAdminSlotArr(adminDocs, day)); }
/* 요일 중 관리자 블록이 덮지 않은 30분 슬롯 수 (0이면 당첨자 가용 시간 없음) */
function optFreeSlotCount(adminDocs, day) {
  return optAdminSlotArr(adminDocs, day).filter(function (v) { return v === null; }).length;
}
/* 슬롯 구간 라벨: end 는 미포함 인덱스 */
function optRangeLabel(start, end) {
  return optSlotLabel(start) + '~' + (end >= OPT_SLOTS_PER_DAY ? '24:00' : optSlotLabel(end));
}

/* ---- 투표 canonical 직렬화 ----
 * votesByMember = { memberId: {r1: dayIdx, r2?: dayIdx, r3?: dayIdx} } */
function optCanonicalVotesJson(votesByMember) {
  const ids = Object.keys(votesByMember).sort();
  const obj = {};
  for (const id of ids) {
    const v = votesByMember[id] || {};
    const o = {};
    for (const k of ['r1', 'r2', 'r3']) {
      const n = optNormRank(v[k]);
      if (!n) continue;
      // ★ 하위호환: '종일' 지원은 구버전과 똑같이 요일 숫자 하나로 직렬화한다.
      //   그래야 시간대 기능 도입 전에 발표된 결과(및 과거 주차)의 시드가 그대로 재현되어
      //   전원 재검증에서 '검증 불일치' 오탐이 나지 않는다.
      //   시간대를 일부만 고른 투표가 하나라도 있으면 그 항목만 {d,q} 로 들어간다.
      o[k] = n.q.length === 4 ? n.d : { d: n.d, q: n.q };
    }
    obj[id] = o;
  }
  return JSON.stringify(obj);
}

/* ---- 투표 유효성 (클라이언트; 서버 rules 와 동일 기준) ---- */
function optValidateVote(ranks) {
  const keys = Object.keys(ranks || {});
  for (const k of keys) if (!['r1', 'r2', 'r3'].includes(k)) return '형식 오류';
  const days = [];
  for (const k of keys) {
    const n = optNormRank(ranks[k]);
    if (!n) return '유효하지 않은 요일 또는 시간대';
    days.push(n.d);
  }
  if (new Set(days).size !== days.length) return '같은 요일을 중복 순위로 투표할 수 없습니다.';
  // 순위는 1부터 연속 (r2가 있으면 r1도, r3가 있으면 r2도)
  if ((ranks.r2 !== undefined && ranks.r1 === undefined) || (ranks.r3 !== undefined && ranks.r2 === undefined))
    return '순위는 1순위부터 순서대로 지정해야 합니다.';
  return null;
}

/* =====================================================================
 * 결정론적 배정 (분기 단위)
 * ---------------------------------------------------------------------
 * 1단계 — 요일 대표 선정 (기존 규칙 그대로, 지원 시간대와 무관하게 동일 경쟁)
 *   ① 현재까지 당첨 수가 적은 사람 (무당첨자 절대 우선)
 *   ② 해당 요일에 대한 순위가 높은(숫자가 작은) 사람
 *   ③ 전체 투표 수가 적은 사람 (더 간절함)
 *   ④ 시드 기반 무작위 (시드 = 마감된 전체 투표의 SHA-256 → 조작 불가·전원 검증 가능)
 *   → 대표는 자기가 지원한 분기만 가져간다 (종일 지원이면 하루 전체).
 *
 * 2단계 — 빈 분기 채우기 (요청 사양)
 *   대표가 쓰지 않고 남은 분기에 '자기 지원 분기 전체가 온전히 들어가는' 사람이 있으면
 *   같은 기준(①~④)으로 뽑아 추가 배정한다. 더 들어갈 사람이 없을 때까지 반복.
 *   부분만 겹치는 사람은 넣지 않는다 (쪼개서 억지로 끼우지 않음).
 *   예) A=Q1Q2, B=Q3Q4, C=Q2Q3 가 같은 요일 동일 순위로 경쟁 →
 *       C가 대표면 Q1·Q4만 남아 아무도 못 들어가므로 C 단독,
 *       A가 대표면 Q3Q4가 비므로 B가 그대로 들어가 A+B 배정.
 *
 * 당첨 수(wins)는 '시간을 받은 요일 수' 로 세며 2단계 배정도 1회로 계산한다
 * (그래야 ①무당첨자 우선이 실제 사용 기회 기준으로 작동).
 * ===================================================================== */
function computeOpticsLottery(votesByMember) {
  const canonical = optCanonicalVotesJson(votesByMember);
  const seed = sha256Hex(canonical);
  const rng = makeRng(seed);

  const memberIds = Object.keys(votesByMember).sort();
  const voteCount = {};       // mid -> 투표한 순위 수 (1~3)
  const rankOf = {};          // mid -> {dayIdx: rank}
  const quartOf = {};         // mid -> {dayIdx: [분기…]}
  for (const mid of memberIds) {
    const v = votesByMember[mid] || {};
    rankOf[mid] = {}; quartOf[mid] = {};
    let n = 0;
    [['r1', 1], ['r2', 2], ['r3', 3]].forEach(function (pair) {
      const nm = optNormRank(v[pair[0]]);
      if (!nm) return;
      rankOf[mid][nm.d] = pair[1];
      quartOf[mid][nm.d] = nm.q;
      n++;
    });
    voteCount[mid] = n;
  }

  const wins = {};            // mid -> 시간을 받은 요일 수
  const dayAssign = {};       // dayIdx(string) -> 대표 memberId (표시·하위호환용)
  const quarterAssign = {};   // dayIdx(string) -> { "1": mid, … }  실제 소유
  const dayContenders = {};   // dayIdx -> [{mid, rank, q}] (결과 표시용)

  /* 후보 목록에서 ①~④ 기준 최소 튜플을 뽑는다 (동률이면 시드 난수) */
  function pick(cands) {
    let best = null;
    for (const c of cands) {
      const w = wins[c.mid] || 0;
      if (!best || w < best.w
          || (w === best.w && (c.rank < best.rank
          || (c.rank === best.rank && voteCount[c.mid] < best.v)))) {
        best = { mid: c.mid, w: w, rank: c.rank, v: voteCount[c.mid] };
      }
    }
    const tied = cands.filter(function (c) {
      return (wins[c.mid] || 0) === best.w && c.rank === best.rank && voteCount[c.mid] === best.v;
    });
    return tied.length === 1 ? tied[0] : tied[Math.floor(rng() * tied.length)];
  }

  for (let day = 0; day < 7; day++) {
    const cands = memberIds
      .filter(function (mid) { return rankOf[mid][day] !== undefined; })
      .map(function (mid) { return { mid: mid, rank: rankOf[mid][day], q: quartOf[mid][day] }; });
    dayContenders[day] = cands.map(function (c) { return { mid: c.mid, rank: c.rank, q: c.q.slice() }; });
    if (!cands.length) continue;

    const owner = {};                       // 분기 -> mid
    const taken = {};                       // 이미 배정된 mid
    const remaining = cands.slice();

    // 1단계: 대표
    const first = pick(remaining);
    first.q.forEach(function (q) { owner[q] = first.mid; });
    taken[first.mid] = true;
    wins[first.mid] = (wins[first.mid] || 0) + 1;
    dayAssign[String(day)] = first.mid;

    // 2단계: 남은 분기에 '통째로' 들어갈 수 있는 사람을 반복해서 채움
    for (;;) {
      const fits = cands.filter(function (c) {
        if (taken[c.mid]) return false;
        return c.q.every(function (q) { return owner[q] === undefined; });
      });
      if (!fits.length) break;
      const nx = pick(fits);
      nx.q.forEach(function (q) { owner[q] = nx.mid; });
      taken[nx.mid] = true;
      wins[nx.mid] = (wins[nx.mid] || 0) + 1;
    }

    const qmap = {};
    for (let k = 1; k <= 4; k++) if (owner[k]) qmap[String(k)] = owner[k];
    quarterAssign[String(day)] = qmap;
  }

  // 1표 이상 투표했으나 어떤 시간대도 받지 못한 인원 (참고 표시용)
  const unassignedMembers = memberIds.filter(function (mid) { return voteCount[mid] > 0 && !(wins[mid] > 0); });

  return { seed, dayAssign, quarterAssign, unassignedMembers, canonical, dayContenders };
}

/* ---- 유효 스케줄 계산: 기본 요일 배정 + 30분 단위 수정본(override) + 관리자 블록 ----
 * scheduleDocs: {dayIdx(string): {slots: {slotIdx(string): memberId|""}}}
 * adminDocs   : {dayIdx(string): {slots: {slotIdx(string): '!kind|memo'|""}}}  (선택)
 * 우선순위(높은 쪽이 이김): 관리자 블록 > 자유 조율 override > 요일 기본 배정
 * 반환: day -> [48] 배열 (memberId | '!kind…' | null)                          */
function optEffectiveSchedule(resultsOrDayAssign, scheduleDocs, adminDocs) {
  const baseSlots = optBaseSlots(resultsOrDayAssign);   // 분기 배정 → 48슬롯 (구형 dayAssign 도 수용)
  const eff = {};
  for (let day = 0; day < 7; day++) {
    const base = baseSlots[day];
    const slots = ((scheduleDocs || {})[String(day)] || {}).slots || {};
    const adm = optAdminSlotArr(adminDocs, day);
    const arr = new Array(OPT_SLOTS_PER_DAY);
    for (let s = 0; s < OPT_SLOTS_PER_DAY; s++) {
      if (adm[s] !== null) { arr[s] = adm[s]; continue; }   // 관리자 블록이 최우선
      const ov = slots[String(s)];
      arr[s] = ov === undefined ? base[s] : (ov === '' ? null : ov);
    }
    eff[day] = arr;
  }
  return eff;
}

/* 슬롯 배열 → 연속 블록 병합 [{start, end(미포함), owner}] (캘린더/표시용) */
function optMergeBlocks(slotArr) {
  const blocks = [];
  let cur = null;
  for (let s = 0; s < slotArr.length; s++) {
    const o = slotArr[s];
    if (cur && cur.owner === o) { cur.end = s + 1; continue; }
    if (cur && cur.owner !== null) blocks.push(cur);
    cur = o !== null ? { start: s, end: s + 1, owner: o } : null;
    if (o === null) cur = null;
  }
  if (cur && cur.owner !== null) blocks.push(cur);
  return blocks;
}

/* Node 테스트용 export */
if (typeof module !== 'undefined' && module.exports) {
  Object.assign(module.exports, {
    OPT_DAYS, OPT_SLOTS_PER_DAY, optSlotLabel, optDayLabel, optFmtDateDow,
    optCanonicalVotesJson, optValidateVote, computeOpticsLottery,
    OPT_QUARTERS, OPT_ALL_QUARTERS, OPT_SLOTS_PER_QUARTER, optQuarterLabel, optQuartersLabel,
    optNormRank, optNormRanks, optQuarterSlots, optBaseSlots,
    optEffectiveSchedule, optMergeBlocks, optPushRemark,
    OPT_ADMIN_MARK, OPT_ADMIN_KINDS, optIsAdminOwner, optAdminMemoClean,
    optAdminOwner, optAdminParse, optAdminLabel, optAdminSlotArr,
    optAdminBlocksOfDay, optFreeSlotCount, optRangeLabel,
  });
}

</script>

<script>
/* =====================================================================
 * Weekly Optics Scheduler - 앱 (1/3): 상태·저장소·공통
 * ===================================================================== */
'use strict';

const IS_DEMO = !FIREBASE_CONFIG.apiKey;

/* ── 봇 하트비트 감시 ──────────────────────────────────────────────────
 * 봇(GAS)은 정상 동작할 때마다 syncMeta/<app>_bot.okMs 를 갱신한다(최대 30분 간격).
 * 이 값이 BOT_STALE_MIN(60분) 보다 낡으면 화면 상단에 경고 배너를 띄운다.
 * 30분 기록 + 60분 경고 — 한 번 거르는 건 눈감아 주고 두 번 연속 놓치면 경고한다.
 * 임계값은 반드시 기록 간격의 2배 이상으로 둘 것. 간격에 바싹 붙이면 정상 동작
 * 중에도 기록 직전마다 배너가 깜빡인다.
 * 2026-10 실사례: GAS 프로젝트가 휴지통에 들어가 5일간 멈췄는데, 휴지통에 있는
 * 스크립트는 아예 실행되지 않아 실행 오류도 Google 실패 알림 메일도 남지 않았다.
 * 아무도 알아채지 못한 채 구글 캘린더만 조용히 낡아간 것이 이 배너를 만든 이유다. */
const BOT_STALE_MIN = 60;
function botStaleMin() { return S.botOkMs ? Math.floor((Date.now() - S.botOkMs) / 60000) : 0; }
function agoText(min) {
  if (min < 60) return min + '분 전';
  const h = Math.floor(min / 60);
  if (h < 24) return h + '시간' + (min % 60 ? ' ' + (min % 60) + '분' : '') + ' 전';
  const d = Math.floor(h / 24);
  return d + '일' + (h % 24 ? ' ' + (h % 24) + '시간' : '') + ' 전';
}

const S = {
  tab: 'cal',
  demoOffset: 0,
  uid: null,
  user: null,               // {id, name, isAdmin, optics}
  members: {},
  votes: {},                // targetWeek: mid -> ranks{r1,r2,r3}
  results: null,            // opticsResults(targetWeek)
  curResults: null,         // opticsResults(votingWeek = 이번 주)
  sched: {},                // targetWeek: day(string) -> {slots}
  curSched: {},             // votingWeek
  adm: {},                  // targetWeek 관리자 블록: day(string) -> {slots}
  curAdm: {},               // votingWeek 관리자 블록
  chat: [],
  hw: null,                 // opticsHardware/current
  hwLog: [],
  remarks: [],              // opticsRemarks/log.entries (최신순, 최대 10개)
  pendingRanks: null,
  viewWeek: 'cur',          // 스케줄 탭: 'cur' | 'next'
  overlay: false,
  verify: null, _verifying: false,
  histCache: {},
  connected: false, authError: null, ensuring: false,
  drag: null,               // {day, s0, s1}
};

const now = () => Date.now() + S.demoOffset;
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const memberName = id => S.members[id]?.name || '(알 수 없음)';
const pinHashOf = (memberId, pin) => sha256Hex(memberId + '|' + pin);
const canonMap = o => JSON.stringify(Object.keys(o || {}).sort().map(k => [k, o[k]]));
/* quarterAssign 은 2단 중첩 맵이라 키 정렬을 두 번 해야 Firestore 반환 순서와 무관해진다 */
const canonQuarters = o => Object.keys(o || {}).sort().map(d => [d, canonMap((o || {})[d])]);
function cycle() { return phaseOf(now()); }

/* 멤버별 고정 색상 (정렬된 id 순서 기반 → 모든 기기에서 동일)
 * 관리자 블록(!repair/!visit)은 멤버 색상과 확실히 구분되는 고정 색을 사용한다. */
function memberColor(id) {
  if (optIsAdminOwner(id)) {
    const p = optAdminParse(id);
    return p && p.code === 'visit'
      ? { bg: '#e6e2f7', fg: '#4b3a8f' }   // 외부인 방문측정 (보라)
      : { bg: '#f3ded8', fg: '#8a2f1c' };  // Repair (벽돌)
  }
  const ids = Object.keys(S.members).sort();
  const i = Math.max(0, ids.indexOf(id));
  const h = (i * 137.508) % 360; // golden angle
  return { bg: `hsl(${h},70%,86%)`, fg: `hsl(${h},65%,30%)` };
}
/* 슬롯 소유자 표시명: 멤버는 이름, 관리자 블록은 'Repair · 메모' */
function ownerLabel(o) { return optIsAdminOwner(o) ? optAdminLabel(o) : memberName(o); }
/* 해당 주의 관리자 블록 문서 묶음 */
function admOf(weekIdx) { const c = cycle(); return weekIdx === c.targetWeek ? S.adm : (weekIdx === c.votingWeek ? S.curAdm : {}); }
/* 관리자가 이 주에 블록을 등록/해제할 수 있는가 (이번 주 ~ 다음 주) */
function canAdminBlock(weekIdx) {
  const c = cycle();
  return !!(S.user?.isAdmin && (weekIdx === c.votingWeek || weekIdx === c.targetWeek));
}

function toast(msg, cls = '') {
  const el = document.createElement('div');
  el.className = 'toastmsg ' + cls;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}
function fmtDT(ms) {
  const d = new Date(ms + KST_OFFSET_MS);
  const wd = OPT_DAYS[(kstDayNum(ms) + 3) % 7];
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${wd}) ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (d ? d + '일 ' : '') + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}
/* 해당 주 스케줄이 수정 가능한 기간인가 (발표 후 ~ 그 주 일요일 24시) */
function editableWeek(weekIdx) {
  const c = cycle();
  const annc = weekStartMs(weekIdx - 1) + 3 * DAY_MS + 12 * 3600000;
  return now() >= annc && now() < weekStartMs(weekIdx + 1);
}
function viewWeekIdx() { const c = cycle(); return S.viewWeek === 'next' ? c.targetWeek : c.votingWeek; }

/* =====================================================================
 * 저장소
 * ===================================================================== */
let store;

function makeFirestoreStore() {
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const FV = firebase.firestore.FieldValue;
  let unsubs = [], listenWeeks = null;

  async function start() {
    try { await auth.signInAnonymously(); }
    catch (e) { S.authError = 'Firebase 인증 실패: ' + e.message; render(); return; }
    auth.onAuthStateChanged(u => { if (!u) return; S.uid = u.uid; resubscribe(); startHeartbeatPoll(); });
  }

  function resubscribe() {
    const c = cycle();
    listenWeeks = c.targetWeek;
    unsubs.forEach(f => f()); unsubs = [];
    const on = (q, cb) => unsubs.push(q.onSnapshot(cb, e => { console.error(e); toast('데이터 수신 오류: ' + e.message, 'err'); }));

    on(db.collection('members'), snap => {
      S.members = {}; snap.forEach(d => S.members[d.id] = { id: d.id, ...d.data() });
      restoreSession(); S.connected = true; render();
    });
    on(db.collection('opticsVotes').where('week', '==', c.targetWeek), snap => {
      const v = {}; snap.forEach(d => { const x = d.data(); v[x.memberId] = x.ranks || {}; });
      S.votes = v;
      if (S.pendingRanks === null && S.user && v[S.user.id]) S.pendingRanks = optNormRanks(v[S.user.id]);
      render();
    });
    on(db.doc('opticsResults/' + c.targetWeek), d => { S.results = d.exists ? d.data() : null; S.verify = null; render(); });
    on(db.doc('opticsResults/' + c.votingWeek), d => { S.curResults = d.exists ? d.data() : null; render(); });
    on(db.collection('opticsSchedule').where('week', '==', c.targetWeek), snap => {
      const m = {}; snap.forEach(d => { const x = d.data(); m[String(x.day)] = x; }); S.sched = m; render();
    });
    on(db.collection('opticsSchedule').where('week', '==', c.votingWeek), snap => {
      const m = {}; snap.forEach(d => { const x = d.data(); m[String(x.day)] = x; }); S.curSched = m; render();
    });
    on(db.collection('opticsAdminBlocks').where('week', '==', c.targetWeek), snap => {
      const m = {}; snap.forEach(d => { const x = d.data(); m[String(x.day)] = x; }); S.adm = m; render();
    });
    on(db.collection('opticsAdminBlocks').where('week', '==', c.votingWeek), snap => {
      const m = {}; snap.forEach(d => { const x = d.data(); m[String(x.day)] = x; }); S.curAdm = m; render();
    });
    on(db.collection('opticsChat').orderBy('createdAt', 'desc').limit(120), snap => {
      const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
      S.chat = arr.reverse(); renderChatLogOnly() || render();
    });
    on(db.doc('opticsHardware/current'), d => { S.hw = d.exists ? d.data() : null; render(); });
    on(db.collection('opticsHardwareLog').orderBy('createdAt', 'desc').limit(25), snap => {
      const arr = []; snap.forEach(d => arr.push(d.data())); S.hwLog = arr; render();
    });
    on(db.doc('opticsRemarks/log'), d => { S.remarks = d.exists ? (d.data().entries || []) : []; render(); });
  }
  /* 캘린더 봇 변경 감지용 리비전 — 캘린더에 영향을 주는 쓰기마다 1 증가.
   * 봇은 매분 이 문서 1건만 읽고 값이 그대로면 스케줄 전체 재조회를 건너뛴다
   * (Firestore 무료 읽기 한도 보호). 실패해도 사용자 동작을 막지 않으며,
   * 봇의 10분 안전 재동기화가 누락을 자가 치유한다. */
  function bumpSync() {
    return db.doc('syncMeta/wos').set({ rev: FV.increment(1) }, { merge: true })
      .catch(e => console.warn('syncMeta bump 실패(무시됨):', e.message));
  }

  /* 봇 하트비트 조회 — 실시간 구독이 아니라 30분 주기 단건 조회다.
   * 배너는 실시간일 필요가 없고, 구독으로 붙이면 접속자 수 × 갱신 횟수만큼
   * Firestore 읽기를 먹는다(읽기 한도로 한 번 앱 전체가 멈춘 이력이 있다). */
  let hbTimer = null;
  function pollHeartbeat() {
    db.doc('syncMeta/wos_bot').get()
      .then(d => { S.botOkMs = d.exists ? (d.data().okMs || 0) : 0; render(); })
      .catch(e => console.warn('봇 상태 조회 실패(무시됨):', e.message));
  }
  function startHeartbeatPoll() {
    if (hbTimer) return;              // onAuthStateChanged 가 여러 번 불려도 타이머는 하나
    pollHeartbeat();
    hbTimer = setInterval(pollHeartbeat, 30 * 60000);
  }

  setInterval(() => { if (S.uid && listenWeeks !== cycle().targetWeek) { S.results = null; S.votes = {}; S.sched = {}; S.curSched = {}; S.adm = {}; S.curAdm = {}; S.pendingRanks = null; resubscribe(); } }, 30000);

  async function fetchWeekVotes(week) {
    const snap = await db.collection('opticsVotes').where('week', '==', week).get();
    const v = {}; snap.forEach(d => { const x = d.data(); v[x.memberId] = x.ranks || {}; });
    return v;
  }

  return {
    start,
    async claim(memberId, pin) {
      const m = S.members[memberId];
      if (!m) throw new Error('멤버를 찾을 수 없습니다.');
      const h = pinHashOf(memberId, pin);
      if (m.pinHash && m.pinHash !== h) throw new Error('PIN이 일치하지 않습니다.');
      await db.doc('members/' + memberId).update({ pinHash: h, uids: FV.arrayUnion(S.uid) });
      await db.doc('uidmap/' + S.uid).set({ memberId });
      localStorage.setItem('wos_member', memberId);
      S.user = { id: memberId, name: m.name, isAdmin: !!m.isAdmin, optics: m.opticsActive === true };
      S.pendingRanks = null; render();
    },
    logout() { localStorage.removeItem('wos_member'); S.user = null; S.pendingRanks = null; render(); },
    async saveVote(ranks) {
      const c = cycle();
      await db.doc(`opticsVotes/${c.targetWeek}_${S.user.id}`).set({
        // 항상 신형 {d,q} 로 정규화해 저장 (구버전 문서를 그대로 되돌려 보내면 규칙에서 거부됨)
        week: c.targetWeek, memberId: S.user.id, ranks: optNormRanks(ranks), updatedAt: FV.serverTimestamp(),
      });
    },
    async deleteVote() {
      const c = cycle();
      await db.doc(`opticsVotes/${c.targetWeek}_${S.user.id}`).delete();
    },
    async ensureResults() {
      const c = cycle();
      if (S.results || S.ensuring || now() < c.announce) return;
      S.ensuring = true;
      try {
        const v = await fetchWeekVotes(c.targetWeek);
        const r = computeOpticsLottery(v);
        await db.doc('opticsResults/' + c.targetWeek).set({
          week: c.targetWeek, seed: r.seed, dayAssign: r.dayAssign, quarterAssign: r.quarterAssign,
          unassignedMembers: r.unassignedMembers, votesJson: r.canonical,
          createdAt: FV.serverTimestamp(), createdByUid: S.uid,
        });
        bumpSync();
        toast('요일 배정 결과가 확정·발표되었습니다.', 'okk');
      } catch (e) { if (!/permission|already/i.test(e.message)) console.error(e); }
      finally { S.ensuring = false; }
    },
    async verifyResults(week, doc) {
      const v = await fetchWeekVotes(week);
      const r = computeOpticsLottery(v);
      // 시간대 배정까지 재계산 결과와 일치해야 검증 통과 (구버전 결과 문서는 dayAssign 만 비교)
      const qOk = doc.quarterAssign === undefined
        || JSON.stringify(canonQuarters(r.quarterAssign)) === JSON.stringify(canonQuarters(doc.quarterAssign));
      return { ok: r.seed === doc.seed && canonMap(r.dayAssign) === canonMap(doc.dayAssign) && qOk, recomputed: r };
    },
    /* 30분 슬롯 일괄 수정: changes = {slotIdx: memberId|""} */
    async setSlots(week, day, changes) {
      const payload = { week, day, slots: {} };
      for (const [k, v] of Object.entries(changes)) payload.slots[k] = v;
      await db.doc(`opticsSchedule/${week}_${day}`).set(payload, { merge: true });
      bumpSync();
    },
    /* 관리자 전용 블록 일괄 수정: changes = {slotIdx: '!kind|memo' | ""(해제)} */
    async setAdminBlock(week, day, changes) {
      const payload = { week, day, slots: {} };
      for (const [k, v] of Object.entries(changes)) payload.slots[k] = v;
      await db.doc(`opticsAdminBlocks/${week}_${day}`).set(payload, { merge: true });
      bumpSync();
    },
    async sendChat(text) {
      await db.collection('opticsChat').add({
        memberId: S.user.id, text, week: cycle().targetWeek, createdAt: FV.serverTimestamp(),
      });
    },
    /* 관리자: 조율 채팅 전체 삭제 (오래된 메시지 포함 서버 전체를 400개 단위 배치로) */
    async clearChat() {
      for (;;) {
        const snap = await db.collection('opticsChat').limit(400).get();
        if (snap.empty) break;
        const batch = db.batch();
        snap.forEach(d => batch.delete(d.ref));
        await batch.commit();
        if (snap.size < 400) break;
      }
    },
    async saveHardware(current, section, summary) {
      await db.doc('opticsHardware/current').set(current);
      await db.collection('opticsHardwareLog').add({
        memberId: S.user.id, section, summary, createdAt: FV.serverTimestamp(), tsMs: Date.now(),
      });
    },
    /* Remark: 트랜잭션으로 최신 10개만 유지(밀어내기) — 동시 기록에도 안전 */
    async addRemark(text) {
      const ref = db.doc('opticsRemarks/log');
      await db.runTransaction(async tx => {
        const d = await tx.get(ref);
        const cur = d.exists ? (d.data().entries || []) : [];
        tx.set(ref, { entries: optPushRemark(cur, { tsMs: Date.now(), memberId: S.user.id, text }) });
      });
    },
    async deleteRemark(tsMs, memberId) {
      const ref = db.doc('opticsRemarks/log');
      await db.runTransaction(async tx => {
        const d = await tx.get(ref);
        const cur = d.exists ? (d.data().entries || []) : [];
        tx.set(ref, { entries: cur.filter(e => !(e.tsMs === tsMs && e.memberId === memberId)) });
      });
    },
    async loadHistory(week) {
      const [rd, votes, ssnap, asnap] = await Promise.all([
        db.doc('opticsResults/' + week).get(), fetchWeekVotes(week),
        db.collection('opticsSchedule').where('week', '==', week).get(),
        db.collection('opticsAdminBlocks').where('week', '==', week).get(),
      ]);
      const sched = {}; ssnap.forEach(d => { const x = d.data(); sched[String(x.day)] = x; });
      const adm = {}; asnap.forEach(d => { const x = d.data(); adm[String(x.day)] = x; });
      return { results: rd.exists ? rd.data() : null, votes, sched, adm };
    },
    admin: {
      addMember: (name) => db.collection('members').add({ name, pinHash: null, uids: [], isAdmin: false, active: false, opticsActive: true, createdAt: FV.serverTimestamp() }),
      setOptics: (id, on) => db.doc('members/' + id).update({ opticsActive: on }),
      /* 명단 관리 공용: id 가 있으면 필드 갱신, 없으면 새 멤버 생성 */
      saveMember: (id, p) => id ? db.doc('members/' + id).update(p)
        : db.collection('members').add({ name: p.name, slackId: p.slackId || '', pinHash: null, uids: [], isAdmin: !!p.isAdmin,
            active: !!p.active, opticsActive: !!p.opticsActive, hidden: false, createdAt: FV.serverTimestamp() }),
      setAdmin: (id, isAdmin) => db.doc('members/' + id).update({ isAdmin }),
      resetPin: (id) => db.doc('members/' + id).update({ pinHash: null }),
      resetDevices: (id) => db.doc('members/' + id).update({ uids: [] }),
      deleteResults: (week) => db.doc('opticsResults/' + week).delete().then(bumpSync),
    },
  };
}

/* ---------------- 데모 저장소 ---------------- */
function makeDemoStore() {
  const mem = { members: {}, votes: {}, results: {}, sched: {}, adm: {}, chat: [], hw: null, hwLog: [], remarks: [], syncRev: 0 };
  const bumpSync = () => { mem.syncRev++; };
  ['김데모', '이샘플', '박예시', '최가상', '정테스트', '한체험'].forEach((n, i) => {
    mem.members['m' + i] = { id: 'm' + i, name: n, pinHash: null, uids: [], isAdmin: i === 0, active: true, opticsActive: true };
  });
  const c0 = phaseOf(Date.now());
  mem.votes[c0.targetWeek] = {
    m1: { r1: { d: 0, q: [1, 2] }, r2: 1 },      // 월 새벽+오전만
    m2: { r1: 1 },
    m3: { r1: 1, r2: 2, r3: 3 },
    m4: { r1: 5, r2: 6 },
    m5: { r1: { d: 0, q: [3, 4] }, r2: 2 },      // 월 오후+저녁만 → m1 과 겹치지 않아 둘 다 배정
  };
  mem.hw = {
    laser: [
      { id: 'l1', band: '405 nm', controller: 'Controller A', turret: '2', updatedAt: Date.now() - 86400000 * 3, updatedBy: 'm1' },
      { id: 'l2', band: '633 nm', controller: 'Controller B', turret: '3', updatedAt: Date.now() - 86400000, updatedBy: 'm3' },
    ],
    turret: [
      { id: 't1', no: '1', mirror: 'Silver mirror', updatedAt: Date.now() - 86400000 * 5, updatedBy: 'm2' },
      { id: 't2', no: '2', mirror: 'Dichroic 550', updatedAt: Date.now() - 86400000 * 2, updatedBy: 'm1' },
    ],
    snspd: [1, 2, 3, 4].map(ch => ({ ch, range: ch <= 2 ? '900-1300 nm' : '', detFiber: ch === 1, ttl: ch === 1, ttlPower: false, updatedAt: Date.now() - 86400000 * ch, updatedBy: 'm' + ch })),
    powermeter: [1, 2, 3].map(no => ({ no, detector: no === 1 ? 'S120C' : '', position: no === 1 ? '샘플 앞' : '', updatedAt: Date.now() - 86400000 * no, updatedBy: 'm1' })),
    extras: [],
  };
  mem.remarks = [
    { tsMs: Date.now() - 3600000 * 20, memberId: 'm3', text: '633 nm 레이저 파워가 평소보다 10% 낮게 측정됨 — 컨트롤러 재부팅 후 정상. 참고 바랍니다.' },
    { tsMs: Date.now() - 86400000 * 2, memberId: 'm1', text: '광학테이블 오른쪽 커버 나사 하나 분실. 임시로 테이프 고정해둠.' },
  ];
  mem.chat = [
    { id: 'c1', memberId: 'm2', text: '목요일 오전만 쓰고 오후는 비울게요. 필요하신 분?', createdAt: Date.now() - 3600000 },
    { id: 'c2', memberId: 'm3', text: '저 목요일 오후 받을게요! 스케줄에서 바로 수정할게요.', createdAt: Date.now() - 3000000 },
  ];

  function pushState() {
    const c = cycle();
    S.members = { ...mem.members };
    S.votes = { ...(mem.votes[c.targetWeek] || {}) };
    if (S.pendingRanks === null && S.user && S.votes[S.user.id]) S.pendingRanks = optNormRanks(S.votes[S.user.id]);
    S.results = mem.results[c.targetWeek] || null;
    S.curResults = mem.results[c.votingWeek] || null;
    S.sched = JSON.parse(JSON.stringify(mem.sched[c.targetWeek] || {}));
    S.curSched = JSON.parse(JSON.stringify(mem.sched[c.votingWeek] || {}));
    S.adm = JSON.parse(JSON.stringify(mem.adm[c.targetWeek] || {}));
    S.curAdm = JSON.parse(JSON.stringify(mem.adm[c.votingWeek] || {}));
    S.chat = [...mem.chat];
    S.hw = mem.hw ? JSON.parse(JSON.stringify(mem.hw)) : null;
    S.hwLog = [...mem.hwLog];
    S.remarks = [...mem.remarks];
    S.connected = true; render();
  }

  return {
    start() { S.uid = 'demo-uid'; pushState(); },
    async claim(memberId, pin) {
      const m = mem.members[memberId];
      const h = pinHashOf(memberId, pin);
      if (m.pinHash && m.pinHash !== h) throw new Error('PIN이 일치하지 않습니다.');
      m.pinHash = h;
      S.user = { id: memberId, name: m.name, isAdmin: !!m.isAdmin, optics: m.opticsActive === true };
      S.pendingRanks = null; pushState();
    },
    logout() { S.user = null; S.pendingRanks = null; pushState(); },
    async saveVote(ranks) { const c = cycle(); (mem.votes[c.targetWeek] = mem.votes[c.targetWeek] || {})[S.user.id] = optNormRanks(ranks); pushState(); },
    async deleteVote() { const c = cycle(); delete (mem.votes[c.targetWeek] || {})[S.user.id]; pushState(); },
    async ensureResults() {
      const c = cycle();
      if (mem.results[c.targetWeek] || now() < c.announce) return;
      const r = computeOpticsLottery(mem.votes[c.targetWeek] || {});
      mem.results[c.targetWeek] = { week: c.targetWeek, seed: r.seed, dayAssign: r.dayAssign, quarterAssign: r.quarterAssign, unassignedMembers: r.unassignedMembers, votesJson: r.canonical };
      bumpSync();
      toast('(데모) 요일 배정 결과가 확정·발표되었습니다.', 'okk'); pushState();
    },
    async verifyResults(week, doc) {
      const r = computeOpticsLottery(mem.votes[week] || {});
      const qOk = doc.quarterAssign === undefined
        || JSON.stringify(canonQuarters(r.quarterAssign)) === JSON.stringify(canonQuarters(doc.quarterAssign));
      return { ok: r.seed === doc.seed && canonMap(r.dayAssign) === canonMap(doc.dayAssign) && qOk, recomputed: r };
    },
    async setSlots(week, day, changes) {
      const w = mem.sched[week] = mem.sched[week] || {};
      const doc = w[String(day)] = w[String(day)] || { week, day, slots: {} };
      Object.assign(doc.slots, changes); bumpSync(); pushState();
    },
    async setAdminBlock(week, day, changes) {
      const w = mem.adm[week] = mem.adm[week] || {};
      const doc = w[String(day)] = w[String(day)] || { week, day, slots: {} };
      Object.assign(doc.slots, changes); bumpSync(); pushState();
    },
    async sendChat(text) { mem.chat.push({ id: 'c' + Math.random(), memberId: S.user.id, text, createdAt: Date.now() }); pushState(); },
    async clearChat() { mem.chat = []; pushState(); },
    async saveHardware(current, section, summary) {
      mem.hw = JSON.parse(JSON.stringify(current));
      mem.hwLog.unshift({ memberId: S.user.id, section, summary, tsMs: Date.now(), createdAt: Date.now() });
      pushState();
    },
    async addRemark(text) {
      mem.remarks = optPushRemark(mem.remarks, { tsMs: Date.now(), memberId: S.user.id, text });
      pushState();
    },
    async deleteRemark(tsMs, memberId) {
      mem.remarks = mem.remarks.filter(e => !(e.tsMs === tsMs && e.memberId === memberId));
      pushState();
    },
    async loadHistory(week) {
      return { results: mem.results[week] || null, votes: mem.votes[week] || {}, sched: mem.sched[week] || {}, adm: mem.adm[week] || {} };
    },
    admin: {
      addMember: async (name) => { const id = 'm' + Math.random().toString(36).slice(2, 8); mem.members[id] = { id, name, pinHash: null, uids: [], isAdmin: false, active: false, opticsActive: true }; pushState(); },
      setOptics: async (id, on) => { mem.members[id].opticsActive = on; pushState(); },
      saveMember: async (id, p) => {
        if (id) Object.assign(mem.members[id], p);
        else { const nid = 'm' + Math.random().toString(36).slice(2, 8);

      deleteResults: async (week) => { delete mem.results[week]; bumpSync(); pushState(); },
    },
    _demo: { pushState, mem },
  };
}

/* ---------------- 모바일 대응 공통 후처리 ---------------- */
/* 표의 헤더(th) 텍스트를 각 td 에 data-label 로 복사해 둔다.
 * 좁은 화면(<=560px)에서는 CSS 가 헤더행을 숨기고 이 라벨을 셀 앞에 붙여
 * 표를 '카드형'으로 바꾼다 — 이 처리가 없으면 표가 뷰포트를 밀어내 화면이 가로로 잘린다.
 * 렌더 결과에 일괄 적용하므로 표를 새로 추가해도 자동으로 따라온다. */
function stampTableLabels(root) {
  (root || document).querySelectorAll('table.list').forEach(t => {
    const head = t.rows[0];
    if (!head) return;
    const labels = [...head.cells].map(c => c.textContent.trim());
    for (let r = 1; r < t.rows.length; r++) {
      [...t.rows[r].cells].forEach((td, i) => {
        // 셀 내용을 하나의 래퍼로 묶는다. 모바일에서 td 가 flex 가 되면 자식 노드가
        // 각각 flex 아이템이 되어 <br> 줄바꿈이나 인라인 배치가 깨지기 때문.
        if (!td.firstElementChild || td.childNodes.length > 1 || !td.firstElementChild.classList.contains('cellval')) {
          const w = document.createElement('span');
          w.className = 'cellval';
          while (td.firstChild) w.appendChild(td.firstChild);
          td.appendChild(w);
        }
        // colspan 안내행이나 헤더가 빈 열은 라벨을 붙이지 않는다
        if (td.colSpan > 1) { td.removeAttribute('data-label'); return; }
        if (labels[i]) td.setAttribute('data-label', labels[i]);
      });
    }
  });
}
/* 선택된 탭이 가로 스크롤 밖에 있으면 보이도록 당겨온다 (탭이 많은 폰 화면 대응).
 * scrollIntoView 는 페이지 세로 스크롤까지 건드릴 수 있어 scrollLeft 를 직접 계산한다. */
function scrollActiveTabIntoView() {
  const nav = document.querySelector('nav.tabs');
  const on = nav && nav.querySelector('button.on');
  if (!nav || !on) return;
  // offsetLeft 는 offsetParent(여기선 body) 기준이라 탭 바 내부 좌표와 어긋난다 → 실제 사각형으로 계산
  const nr = nav.getBoundingClientRect(), br = on.getBoundingClientRect();
  const delta = (br.left - nr.left) - (nav.clientWidth - br.width) / 2;  // 가운데로 오도록
  nav.scrollLeft = Math.max(0, Math.min(nav.scrollLeft + delta, nav.scrollWidth - nav.clientWidth));
}

/* ---------------- 주간 캘린더 컴포넌트 ---------------- */
function calCtx(weekIdx) {
  const c = cycle();
  const isNext = weekIdx === c.targetWeek;
  return {
    weekIdx,
    results: isNext ? S.results : S.curResults,
    sched: isNext ? S.sched : S.curSched,
    adm: isNext ? S.adm : S.curAdm,
    votes: isNext ? S.votes : null,
  };
}
function calendarHtml(weekIdx, mini) {
  const ctx = calCtx(weekIdx);
  const dayAssign = ctx.results?.dayAssign || {};
  const eff = optEffectiveSchedule(ctx.results || {}, ctx.sched, ctx.adm);
  const canEdit = !!(S.user && (S.user.optics || S.user.isAdmin) && editableWeek(weekIdx) && ctx.results);
  // 관리자는 발표 전(투표 기간)에도 Repair·방문측정 블록을 잡을 수 있어야 함
  const admEdit = canAdminBlock(weekIdx);
  const cellCls = (canEdit || admEdit) ? 'cell editable' : 'cell';

  // 헤더 (요일 당첨자 + 관리자 블록으로 인한 가용시간 표시)
  let hd = `<div class="hd"></div>`;
  for (let d = 0; d < 7; d++) {
    const qa = (ctx.results && ctx.results.quarterAssign && ctx.results.quarterAssign[String(d)]) || null;
    const owners = qa ? [...new Set(Object.values(qa))] : (dayAssign[String(d)] ? [dayAssign[String(d)]] : []);
    const owner = owners.length === 1 ? owners[0] : null;
    const free = optFreeSlotCount(ctx.adm, d);
    const blocked = free < OPT_SLOTS_PER_DAY;
    const admNote = !blocked ? ''
      : (free === 0 ? ' · <b style="color:var(--red)">관리자 점유(종일)</b>' : ` · <b style="color:var(--risk)">관리자 ${(OPT_SLOTS_PER_DAY - free) / 2}h</b>`);
    const ownerNote = owner ? ' · ' + esc(memberName(owner))
      : (owners.length > 1 ? ' · ' + esc(owners.map(memberName).join('/')) : '');
    hd += `<div class="hd">${OPT_DAYS[d]}<small>${fmtDate(optDayDate(weekIdx, d))}${ownerNote}${admNote}</small></div>`;
  }
  // 희망순위 오버레이 행
  let ov = '';
  if (S.overlay) {
    const votes = ctx.votes || {};
    ov = `<div class="rankchips"></div>`;
    for (let d = 0; d < 7; d++) {
      let chips = '';
      for (const [mid, r] of Object.entries(votes)) {
        [['r1', 1], ['r2', 2], ['r3', 3]].forEach(([k, n]) => {
          const nm = optNormRank(r[k]);
          if (!nm || nm.d !== d) return;
          const qt = nm.q.length === 4 ? '' : ' ' + optQuartersLabel(nm.q);
          chips += `<span class="rankchip rc${n}">${'①②③'[n - 1]} ${esc(memberName(mid))}${esc(qt)}</span>`;
        });
      }
      ov += `<div class="rankchips">${chips || '<span class="muted" style="font-size:10px">-</span>'}</div>`;
    }
  }
  // 본문 (48행)
  let body = '';
  for (let s = 0; s < OPT_SLOTS_PER_DAY; s++) {
    const hour = s % 2 === 0;
    const tlab = mini ? (s % 4 === 0 ? String(s / 2) + '시' : '') : (hour ? optSlotLabel(s) : '');
    body += `<div class="tl">${tlab}</div>`;
    for (let d = 0; d < 7; d++) {
      const o = eff[d][s];
      const isAdm = optIsAdminOwner(o);
      const runStart = o !== null && (s === 0 || eff[d][s - 1] !== o);
      let style = '';
      if (o) { const col = memberColor(o); style = ` style="background:${col.bg}"`; }
      const lbl = runStart ? `<span class="lbl" style="color:${o ? memberColor(o).fg : ''}">${isAdm ? '🔒 ' : ''}${esc(ownerLabel(o))}</span>` : '';
      body += `<div class="${cellCls}${hour ? ' hour' : ''}${isAdm ? ' admblock' : ''}" data-day="${d}" data-slot="${s}" data-week="${weekIdx}"${isAdm ? ' data-adm="1"' : ''}${style}>${lbl}</div>`;
    }
  }
  return `<div class="calwrap"><div class="cal${mini ? ' mini' : ''}" data-calweek="${weekIdx}" data-editable="${(canEdit || admEdit) ? 1 : 0}" data-canedit="${canEdit ? 1 : 0}" data-admedit="${admEdit ? 1 : 0}">${hd}${ov}${body}</div></div>`;
}

/* 해당 주의 관리자 블록 요약 HTML (요일별 구간 나열). 없으면 '' */
function admSummaryHtml(weekIdx, adm) {
  const parts = [];
  for (let d = 0; d < 7; d++) {
    const blocks = optAdminBlocksOfDay(adm, d);
    if (!blocks.length) continue;
    const free = optFreeSlotCount(adm, d);
    parts.push(`<li><b>${OPT_DAYS[d]} (${fmtDate(optDayDate(weekIdx, d))})</b> — ` +
      blocks.map(b => `<span class="badge b-red">${esc(optAdminLabel(b.owner))} ${optRangeLabel(b.start, b.end)}</span>`).join(' ') +
      (free === 0 ? ' <b style="color:var(--red)">→ 이 요일은 종일 사용 불가 (당첨자 가용 시간 없음)</b>' : ` <span class="muted">→ 나머지 ${free / 2}시간은 정상 사용 가능</span>`) +
      '</li>');
  }
  if (!parts.length) return '';
  return `<div class="note" style="border:1.5px solid var(--red);background:var(--red-soft)">
    <b>🔒 관리자 지정 일정 (Repair · 외부인 방문측정)</b> — 아래 시간대는 <b>예약·조율 대상에서 제외</b>됩니다.
    요일 당첨자도 이 시간을 제외한 나머지 시간만 사용합니다.
    <ul style="margin:6px 0 0 18px">${parts.join('')}</ul></div>`;
}

    const mine = ['r1', 'r2', 'r3'].map(k => optNormRank((my || {})[k])).filter(Boolean);
    return `<div class="card"><h2>사전 투표 (요일 · 시간대)</h2>
      <p class="muted">지금은 투표 기간이 아닙니다. 투표는 <b>매주 월 00:00 ~ 수 24:00</b>. 다음 시작: <b>${fmtDT(weekStartMs(c.votingWeek + 1))}</b></p>
      ${mine.length ? `<div class="note">이번 주 내 투표(마감됨): ${mine.map((n, i) => `${i + 1}순위 ${OPT_DAYS[n.d]} <b>${optQuartersLabel(n.q)}</b>`).join(', ')}</div>` : ''}</div>`;
  }
  if (S.pendingRanks === null) S.pendingRanks = optNormRanks(S.votes[S.user.id]);
  const p = S.pendingRanks;
  const norm = k => optNormRank(p[k]);
  const saved = optCanonicalVotesJson({ x: S.votes[S.user.id] || {} }) === optCanonicalVotesJson({ x: p });
  const myPick = d => {           // 이 요일이 몇 순위이고 어떤 분기를 골랐는지
    for (const [k, n] of [['r1', 1], ['r2', 2], ['r3', 3]]) {
      const v = norm(k);
      if (v && v.d === d) return { rank: n, q: v.q };
    }
    return null;
  };
  // 요일별 순위 집계 + 분기별 지원자 수 (남들이 어느 시간대를 원하는지 보고 고를 수 있게)
  const agg = Array.from({ length: 7 }, () => [0, 0, 0]);
  const qAgg = Array.from({ length: 7 }, () => [0, 0, 0, 0]);
  for (const r of Object.values(S.votes)) {
    [['r1', 0], ['r2', 1], ['r3', 2]].forEach(([k, i]) => {
      const n = optNormRank(r[k]);
      if (!n) return;
      agg[n.d][i]++;
      n.q.forEach(q => qAgg[n.d][q - 1]++);
    });
  }
  const cards = Array.from({ length: 7 }, (_, d) => {
    const pick = myPick(d);
    const a = agg[d];
    // 관리자 블록(Repair/방문측정)은 투표 시점에 반드시 보여야 함 — 당첨돼도 그 시간은 못 씀
    const blocks = optAdminBlocksOfDay(S.adm, d);
    const free = optFreeSlotCount(S.adm, d);
    const admHtml = !blocks.length ? ''
      : `<div class="agg" style="color:var(--risk);line-height:1.5">🔒 ${blocks.map(b => esc(optAdminLabel(b.owner)) + ' ' + optRangeLabel(b.start, b.end)).join('<br>')}
         ${free === 0 ? '<br><b style="color:var(--red)">종일 사용 불가</b>' : ''}</div>`;
    // 분기 칩: 고른 요일이면 내 선택 표시, 아니면 눌러서 '그 시간대만' 바로 지원
    const qs = OPT_QUARTERS.map(o => {
      const on = pick && pick.q.indexOf(o.q) >= 0;
      const cnt = qAgg[d][o.q - 1];
      return `<button class="qchip${on ? ' on' : ''}" data-votq="${d}|${o.q}"
        title="${o.key} ${o.label} ${o.range}시${cnt ? ` · 현재 ${cnt}명 지원` : ''}">
        <span class="qk">${o.label}</span><span class="qr">${o.range}</span>
        ${cnt ? `<span class="qn">${cnt}</span>` : ''}</button>`;
    }).join('');
    return `<div class="daycard ${pick ? 'picked' : ''}${free === 0 ? ' fullblocked' : ''}">
      ${pick ? `<span class="myrank">${'①②③'[pick.rank - 1]}</span>` : ''}
      <div class="dayhit" data-votday="${d}">
        <b>${OPT_DAYS[d]}</b><div class="date">${fmtDate(optDayDate(c.targetWeek, d))}</div>
        <div class="agg">${a[0] + a[1] + a[2] ? `①${a[0]} ②${a[1]} ③${a[2]}` : '지원 없음'}</div>
      </div>
      <div class="qchips">${qs}</div>
      ${pick ? `<div class="qsum">${esc(optQuartersLabel(pick.q))}</div>` : ''}
      ${admHtml}
    </div>`;
  }).join('');
  const picks = ['r1', 'r2', 'r3'].map(norm).filter(Boolean);
  return `<div class="card">
    <h2>사전 투표 (요일 · 시간대) — ${weekLabel(c.targetWeek)} 대상</h2>
    <p class="muted" style="margin:6px 0 12px">
      요일 이름을 누르면 <b>그 요일 종일</b>로 1순위 → 2순위 → 3순위 순서로 지정됩니다 (다시 누르면 해제, 아래 순위는 자동으로 당겨짐).<br>
      하루 전체가 필요 없다면 <b>새벽 / 오전 / 오후 / 저녁</b> 칩을 눌러 원하는 시간대만 남기세요 — 칩을 바로 누르면 <b>그 시간대만</b> 지원됩니다.
      배정도 그 시간대 단위로 이뤄지므로, 필요 없는 시간을 나중에 취소할 필요가 없습니다.<br>
      3개를 모두 채울 필요는 없으며, <b>적게 투표할수록 동순위 경쟁에서 우선</b>합니다. 칩의 작은 숫자는 현재 그 시간대 지원자 수입니다.</p>
    <div class="flexrow" style="margin-bottom:10px">
      <span>내 투표: ${picks.length ? picks.map((n, i) => `<span class="badge b-accent">${i + 1}순위 ${OPT_DAYS[n.d]} ${esc(optQuartersLabel(n.q))}</span>`).join(' ') : '<span class="muted">없음</span>'}</span>
      <span style="margin-left:auto" class="${saved ? 'muted' : 'verify-bad'}">${saved ? '저장됨 ✓' : '변경사항 있음 — 저장 필요!'}</span>
    </div>
    ${admSummaryHtml(c.targetWeek, S.adm)}
    <div class="daycards">${cards}</div>
    <div class="flexrow" style="margin-top:14px">
      <button class="btn primary" id="btnSaveVote" ${saved ? 'disabled' : ''}>투표 저장</button>
      <button class="btn" id="btnResetVote">저장된 상태로 되돌리기</button>
      <button class="btn danger" id="btnClearVote">투표 전체 취소</button>
      <span class="muted">마감: ${fmtDT(c.voteClose)} (수요일 24시)</span>
    </div></div>`;
}

/* ---------------- 탭: 일정 조율 (미니 스케줄 + 채팅) ---------------- */
function renderCoord() {
  const c = cycle();
  const w = viewWeekIdx();
  const msgs = S.chat.map(m => {
    const mine = S.user && m.memberId === S.user.id;
    const t = m.createdAt?.toMillis ? m.createdAt.toMillis() : (typeof m.createdAt === 'number' ? m.createdAt : Date.now());
    return `<div class="msg ${mine ? 'mine' : ''}">
      <div class="meta">${esc(memberName(m.memberId))} · ${fmtDT(t)}</div>
      <div class="bubble" translate="no">${esc(m.text)}</div></div>`;
  }).join('');
  return `<div class="card">
    <div class="flexrow" style="margin-bottom:10px">
      <h2 style="margin:0">실시간 예약 · 일정 조율</h2>
      <span class="weekchips">
        <button data-vw="cur" class="${S.viewWeek === 'cur' ? 'on' : ''}">이번 주</button>
        <button data-vw="next" class="${S.viewWeek === 'next' ? 'on' : ''}">다음 주</button>
      </span>
      <label class="muted" style="margin-left:auto;cursor:pointer;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="ovToggleCoord" ${S.overlay ? 'checked' : ''} style="accent-color:var(--accent)">
        희망순위 표시 <span class="rankchip rc1" style="opacity:1">①1순위</span><span class="rankchip rc2" style="opacity:1">②2순위</span><span class="rankchip rc3" style="opacity:1">③3순위</span>
      </label>
    </div>
    <p class="muted" style="margin-bottom:10px">미니 스케줄에서 바로 수정 → 즉시 반영${S.overlay ? ' · 희망순위는 다음 주 스케줄에서만 표시됩니다' : ''} · 🔒 표시 구간은 관리자 지정 일정으로 예약·조율 불가
      · 📱 모바일: 요일 칸을 쓸면 범위 선택, 화면 스크롤은 왼쪽 시간 눈금이나 표 바깥에서</p>
    ${admSummaryHtml(w, calCtx(w).adm)}
    <div class="coord">
      <div>${calendarHtml(w, true)}</div>
      <div class="chatbox">
        <div class="chatlog" id="chatlog">${msgs || '<p class="muted" style="text-align:center;margin-top:20px">아직 메시지가 없습니다.<br>배정 결과를 두고 자유롭게 조율하세요!</p>'}</div>
        <div class="chatin">
          <input id="chatText" placeholder="${S.user?.optics ? '메시지 입력 후 Enter' : '광학 활성 멤버만 채팅 가능'}" ${S.user?.optics ? '' : 'disabled'} maxlength="500">
          <button class="btn primary" id="btnChatSend" ${S.user?.optics ? '' : 'disabled'}>전송</button>
        </div>
        ${S.user?.isAdmin ? '<div style="padding:6px 10px;border-top:1px solid var(--line);background:var(--subtle);text-align:right"><button class="btn sm danger" id="btnChatClear">🗑 채팅 전체 초기화 (관리자)</button></div>' : ''}
      </div>
    </div></div>`;
}
/* 채팅 수신 시 로그만 갱신(입력 초기화 방지). 성공 시 true */
function renderChatLogOnly() {
  const el = $('#chatlog');
  if (!el || S.tab !== 'coord') return false;
  const msgs = S.chat.map(m => {
    const mine = S.user && m.memberId === S.user.id;
    const t = m.createdAt?.toMillis ? m.createdAt.toMillis() : (typeof m.createdAt === 'number' ? m.createdAt : Date.now());
    return `<div class="msg ${mine ? 'mine' : ''}"><div class="meta">${esc(memberName(m.memberId))} · ${fmtDT(t)}</div><div class="bubble" translate="no">${esc(m.text)}</div></div>`;
  }).join('');
  el.innerHTML = msgs;
  el.scrollTop = el.scrollHeight;
  return true;
}

/* ---------------- 탭: 배정 결과 ---------------- */
function renderResults() {
  const c = cycle();
  const weekOpts = [];
  for (let w = c.targetWeek; w >= c.targetWeek - 8; w--) weekOpts.push(w);
  const sel = S.resultsWeek ?? c.targetWeek;
  const isCurrent = sel === c.targetWeek;
  const data = isCurrent ? { results: S.results, votes: S.votes, adm: S.adm } : S.histCache[sel];
  let body = '';
  if (!isCurrent && !data) {
    body = '<p class="muted">불러오는 중...</p>';
    store.loadHistory(sel).then(async d => {
      let verify = null;
      if (d.results) { try { verify = await store.verifyResults(sel, d.results); } catch (e) {} }
      S.histCache[sel] = { ...d, verify }; render();
    }).catch(() => { S.histCache[sel] = { results: null, votes: {} }; render(); });
  } else if (!data?.results) {
    body = isCurrent && c.phase !== 'BOOKING'
      ? `<p class="muted">배정 발표 전입니다. 발표: <b>${fmtDT(c.announce)}</b> (목요일 12:00). 발표 즉시 자동 표시됩니다.</p>`
      : '<p class="muted">해당 주차의 배정 데이터가 없습니다.</p>';
  } else {
    const r = data.results;
    const verify = isCurrent ? S.verify : (data.verify && { ok: data.verify.ok });
    const vbadge = verify == null ? '<span class="badge b-gray">검증 중...</span>'
      : verify.ok ? '<span class="badge b-green">✓ 검증 완료 — 투표 데이터로부터 재계산한 결과와 일치</span>'
      : '<span class="badge b-red">⚠ 검증 불일치 — 관리자에게 결과 재생성을 요청하세요</span>';
    const adm = data.adm || {};
    const rows = Array.from({ length: 7 }, (_, d) => {
      const qa = (r.quarterAssign || {})[String(d)];
      const m = (r.dayAssign || {})[String(d)];
      // 분기별 소유자를 사람 단위로 묶어 '이샘플 00-12시' 처럼 표기
      let who;
      if (qa && Object.keys(qa).length) {
        const byMid = {};
        for (let k = 1; k <= 4; k++) if (qa[String(k)]) (byMid[qa[String(k)]] = byMid[qa[String(k)]] || []).push(k);
        const parts = Object.keys(byMid).sort((a, b) => Math.min(...byMid[a]) - Math.min(...byMid[b]))
          .map(mid => `<b>${esc(memberName(mid))}</b> <span class="muted">${esc(optQuartersLabel(byMid[mid]))}</span>`);
        const usedQ = Object.keys(qa).length;
        who = parts.join('<br>') + (usedQ < 4 ? `<br><span class="muted">나머지 시간은 비어 있음 — 자유 조율 가능</span>` : '');
      } else if (m) {
        who = '<b>' + esc(memberName(m)) + '</b> <span class="muted">종일</span>';
      } else {
        who = '<span class="muted">미배정 — 자유 조율 가능</span>';
      }
      const blocks = optAdminBlocksOfDay(adm, d);
      const free = optFreeSlotCount(adm, d);
      const admCell = !blocks.length ? '<span class="muted">–</span>'
        : blocks.map(b => `<span class="badge b-red">${esc(optAdminLabel(b.owner))} ${optRangeLabel(b.start, b.end)}</span>`).join(' ')
          + (free === 0 ? ' <b style="color:var(--red)">가용 시간 없음</b>' : ` <span class="muted">(가용 ${free / 2}h)</span>`);
      return `<tr><td>${OPT_DAYS[d]} (${fmtDate(optDayDate(sel, d))})</td>
        <td>${who}</td>
        <td>${admCell}</td></tr>`;
    }).join('');
    body = `
      <div class="flexrow" style="margin-bottom:10px">${vbadge}</div>
      <table class="list"><tr><th>요일</th><th>배정 (시간대별)</th><th>관리자 지정 일정</th></tr>${rows}</table>
      <p class="muted" style="margin-top:6px">배정은 <b>새벽/오전/오후/저녁 4개 시간대 단위</b>로 이뤄집니다. 대표가 지원하지 않은 시간대에 <b>다른 지원자의 희망 시간대가 통째로 들어가면 그 사람도 함께 배정</b>됩니다.
      배정자는 <b>관리자 지정 일정(Repair·외부인 방문측정)을 제외한 나머지 시간</b>을 사용합니다. 관리자 블록은 추첨 알고리즘과 무관한 별도 레이어이므로 위 검증 결과에 영향을 주지 않습니다.</p>
      <h3>아쉽게 배정받지 못한 인원</h3>
      <p class="muted">${(r.unassignedMembers || []).length ? r.unassignedMembers.map(m => esc(memberName(m))).join(', ') + ' — 실시간 예약 탭에서 협의해 시간을 나눠 쓸 수 있습니다.' : '없음 (투표자 전원 배정)'}</p>
      <h3>공정성 증빙</h3>
      <p class="muted" style="word-break:break-all">배정 기준: ① 무당첨자 우선 → ② 순위 → ③ 투표 수 적은 사람 → ④ 시드 무작위. (대표 선정 후 남은 시간대에 대해 같은 기준으로 추가 배정)
      시드(투표 데이터 SHA-256): <code class="k">${esc(r.seed || '')}</code><br>
      시드가 투표 내용 자체에서 결정되므로 누구도 결과를 조작·예측할 수 없으며, 모든 접속자가 독립 재검증합니다.</p>`;
  }
  return `<div class="card">
    <div class="flexrow"><h2 style="margin:0">투표 결과 (요일 배정)</h2>
      <select id="selWeek" style="margin-left:auto;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-family:inherit">
        ${weekOpts.map(w => `<option value="${w}" ${w === sel ? 'selected' : ''}>${weekLabel(w)}${w === c.targetWeek ? ' (다음 주)' : w === c.votingWeek ? ' (이번 주)' : ''}</option>`).join('')}
      </select></div>
    <div style="margin-top:10px">${body}</div></div>`;
}

/* =====================================================================
 * Weekly Optics Scheduler - 앱 (3/3): Hardware Log·명단·규칙·관리자·이벤트
 * ===================================================================== */

/* ---------------- Hardware Log ---------------- */
function defaultHw() {
  return {
    laser: [],
    turret: [],
    snspd: [1, 2, 3, 4].map(ch => ({ ch, range: '', detFiber: false, ttl: false, ttlPower: false, updatedAt: 0, updatedBy: '' })),
    powermeter: [1, 2, 3].map(no => ({ no, detector: '', position: '', updatedAt: 0, updatedBy: '' })),
    extras: [],
  };
}
function hwMeta(row) {
  if (!row.updatedAt) return '<span class="meta">-</span>';
  return `<span class="meta">${optFmtDateDow(row.updatedAt)}<br>${esc(memberName(row.updatedBy))}</span>`;
}
const hwEdit = { section: null }; // 현재 편집 중 섹션

function renderHw() {
  const hw = S.hw ? JSON.parse(JSON.stringify(S.hw)) : defaultHw();
  ['laser', 'turret', 'snspd', 'powermeter', 'extras'].forEach(k => { if (!hw[k]) hw[k] = defaultHw()[k]; });
  const canEdit = !!(S.user && (S.user.optics || S.user.isAdmin));
  const ed = s => hwEdit.section === s;
  const editBtn = s => canEdit ? (ed(s)
    ? `<button class="btn sm primary" data-hwsave="${s}">저장</button> <button class="btn sm" data-hwcancel>취소</button>`
    : `<button class="btn sm" data-hwedit="${s}">수정</button>`) : '';
  const txt = (s, i, f, v, ph = '') => ed(s)
    ? `<input type="text" data-hw="${s}.${i}.${f}" value="${esc(v || '')}" placeholder="${ph}">`
    : (v ? esc(v) : '<span class="muted">-</span>');
  const chk = (s, i, f, v, label) => `<label style="white-space:nowrap;font-size:12.5px"><input type="checkbox" data-hw="${s}.${i}.${f}" ${v ? 'checked' : ''} ${ed(s) ? '' : 'disabled'} style="accent-color:var(--accent)"> ${label}</label>`;

  const laserRows = hw.laser.map((r, i) => `<tr>
    <td>${txt('laser', i, 'band', r.band, '예: 633 nm')}</td>
    <td>${txt('laser', i, 'controller', r.controller, '연결 컨트롤러')}</td>
    <td>${txt('laser', i, 'turret', r.turret, 'Align된 Turret #')}</td>
    <td>${hwMeta(r)}</td>
    ${ed('laser') ? `<td><button class="btn sm danger" data-hwdel="laser.${i}">삭제</button></td>` : ''}</tr>`).join('')
    || `<tr><td colspan="5" class="muted">등록된 레이저가 없습니다.</td></tr>`;

  const turretRows = hw.turret.map((r, i) => `<tr>
    <td>${txt('turret', i, 'no', r.no, 'Turret 번호')}</td>
    <td>${txt('turret', i, 'mirror', r.mirror, '장착 Mirror')}</td>
    <td>${hwMeta(r)}</td>
    ${ed('turret') ? `<td><button class="btn sm danger" data-hwdel="turret.${i}">삭제</button></td>` : ''}</tr>`).join('')
    || `<tr><td colspan="4" class="muted">등록된 Turret이 없습니다.</td></tr>`;

  const snspdRows = hw.snspd.map((r, i) => `<tr>
    <td><b>SNSPD ${r.ch}</b></td>
    <td>${txt('snspd', i, 'range', r.range, '연결 채널 파장범위')}</td>
    <td>${chk('snspd', i, 'detFiber', r.detFiber, 'Detector(Fiber)')}<br>${chk('snspd', i, 'ttl', r.ttl, 'TTL converter')}<br>${chk('snspd', i, 'ttlPower', r.ttlPower, 'TTL Power cable')}</td>
    <td>${hwMeta(r)}</td></tr>`).join('');

  const pmRows = hw.powermeter.map((r, i) => `<tr>
    <td><b>Powermeter ${r.no}</b></td>
    <td>${txt('powermeter', i, 'detector', r.detector, 'Connected detector')}</td>
    <td>${txt('powermeter', i, 'position', r.position, 'Position')}</td>
    <td>${hwMeta(r)}</td></tr>`).join('');

  const logRows = S.hwLog.map(l => {
    const t = l.tsMs || (l.createdAt?.toMillis ? l.createdAt.toMillis() : 0);
    return `<tr><td class="meta" style="white-space:nowrap">${t ? optFmtDateDow(t) : '-'}</td>

const HW_SECTION_LABEL = { laser: 'LASER', turret: 'Microscope Turret', snspd: 'SNSPD', powermeter: 'Powermeter', extras: '기타 요소' };
/* 편집 저장: DOM 입력 수집 → diff 요약 생성 → 저장+로그 */
async function saveHwSection(section) {
  const cur = S.hw ? JSON.parse(JSON.stringify(S.hw)) : defaultHw();
  ['laser', 'turret', 'snspd', 'powermeter', 'extras'].forEach(k => { if (!cur[k]) cur[k] = defaultHw()[k]; });
  const before = JSON.parse(JSON.stringify(cur[section]));
  // 입력값 반영
  document.querySelectorAll(`[data-hw^="${section}."]`).forEach(inp => {
    const [, i, f] = inp.dataset.hw.split('.');
    if (!cur[section][i]) return;
    cur[section][i][f] = inp.type === 'checkbox' ? inp.checked : inp.value.trim();
  });
  // diff 요약
  const label = row => row.band || ('Turret ' + (row.no || '?')) || row.item;
  const fields = {
    laser: [['band', '파장'], ['controller', '컨트롤러'], ['turret', 'Align Turret']],
    turret: [['no', '번호'], ['mirror', 'Mirror']],
    snspd: [['range', '파장범위'], ['detFiber', 'Detector(Fiber)'], ['ttl', 'TTL converter'], ['ttlPower', 'TTL Power cable']],
    powermeter: [['detector', 'Detector'], ['position', 'Position']],
    extras: [['item', '품목'], ['location', '위치']],
  }[section];
  const lines = [];
  const fmtV = v => v === true ? '연결' : v === false ? '해제' : (v || '(없음)');
  const nameOfRow = (row) => section === 'laser' ? (row.band || '(무명)') : section === 'turret' ? ('Turret ' + (row.no || '?'))
    : section === 'snspd' ? ('SNSPD ' + row.ch) : section === 'powermeter' ? ('Powermeter ' + row.no) : (row.item || '(무명)');
  const maxLen = Math.max(before.length, cur[section].length);
  for (let i = 0; i < maxLen; i++) {
    const b = before[i], a = cur[section][i];
    if (b && !a) { lines.push(`- ${nameOfRow(b)}: 제거됨`); continue; }
    if (!b && a) { lines.push(`- ${nameOfRow(a)}: 신규 추가 (${fields.map(([f, l]) => `${l}=${fmtV(a[f])}`).join(', ')})`); a.updatedAt = Date.now(); a.updatedBy = S.user.id; continue; }
    const diffs = fields.filter(([f]) => JSON.stringify(b[f]) !== JSON.stringify(a[f]));
    if (diffs.length) {
      lines.push(`- ${nameOfRow(a)}: ` + diffs.map(([f, l]) => `${l} ${fmtV(b[f])} → ${fmtV(a[f])}`).join(', '));
      a.updatedAt = Date.now(); a.updatedBy = S.user.id;
    }
  }
  if (!lines.length) { hwEdit.section = null; render(); toast('변경사항이 없습니다.'); return; }
  try {
    await store.saveHardware(cur, HW_SECTION_LABEL[section], lines.join('\n'));
    hwEdit.section = null;
    toast('저장되었습니다. 변경 내용이 Slack에 곧 공지됩니다.', 'okk');
  } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
}

/* ---------------- 명단 / 규칙 / 관리자 ---------------- */
const MEMBER_APP = 'wos';   // 이 앱이 합성(wss)인지 광학(wos)인지 — 새 멤버 기본 참여에만 쓰임
/* =====================================================================
 * 명단 관리 (관리자, «명단» 탭) — 합성·광학 두 앱이 같은 members 컬렉션을 쓰므로
 * 이 블록은 두 앱에 '글자 그대로 같은 코드'로 들어간다. 앱별 차이는 MEMBER_APP 하나.
 *   합성 참여 = active === true(구버전 문서는 필드 없음=참여)   광학 참여 = opticsActive === true
 *   삭제 = '숨김': hidden:true + 두 참여 끔 + 기기 연결 해제. 로그인·투표·예약·명단에서
 *          빠지고 서버 권한도 사라지지만(규칙이 참여·기기로 판정), 과거 배정·예약·기록의
 *          이름은 그대로 남는다. «삭제한 멤버»에서 되살릴 수 있다(PIN 은 유지).
 *   Slack ID = 봇의 리마인드·발표 태그용. 비어 있으면 봇 코드의 이름 기준 표(SLACK_MENTION)를
 *          쓰므로, 이름을 바꿀 땐 Slack ID 를 채워 두는 게 안전하다.
 * ===================================================================== */
const MEMBER_SLACK_RE = /^[UW][A-Z0-9]{6,}$/;
const memSynthOn = m => m.active !== false;
const memOpticsOn = m => m.opticsActive === true;
const memByName = (a, b) => a.name.localeCompare(b.name, 'ko');
/* 숨기지 않았고 어느 한쪽이라도 참여 중인 관리자 수 (exceptId 제외) — 잠금 방지용 */
function memAdminCount(exceptId) {

    && (memSynthOn(x) || memOpticsOn(x))).length;

function memberAdminHtml() {

    <td class="memacts">

  const hidRows = hid.map(m => `<tr>

  return `<div class="card"><h2>명단 관리 <span class="badge b-violet">관리자</span></h2>
    <p class="muted" style="margin:4px 0 12px">합성·광학 두 앱이 같은 명단을 씁니다. 여기서 바꾸면 양쪽에 바로 반영됩니다.
      새 멤버는 첫 로그인 때 본인 PIN을 등록합니다.</p>
    <div class="flexrow" style="margin-bottom:12px"><button class="btn primary" data-mem="add">+ 멤버 추가</button>
      <span class="muted">참여 중 ${vis.filter(m => memSynthOn(m) || memOpticsOn(m)).length}명 · 합성 ${vis.filter(memSynthOn).length} · 광학 ${vis.filter(memOpticsOn).length}</span></div>

    ${hid.length ? `<details class="memhidden"><summary>삭제한 멤버 ${hid.length}명</summary>

      Slack ID는 봇의 리마인드·발표 태그에 쓰입니다 (Slack 프로필 → ⋮ → <b>멤버 ID 복사</b>, U로 시작).</div>

function openMemberEditor(id) {
  const m = id ? S.members[id] : null;
  const on = (v) => v ? 'checked' : '';
  const synth = m ? memSynthOn(m) : MEMBER_APP === 'wss';

      <label class="memchk"><input type="checkbox" id="memSynth" ${box} ${on(synth)}> 합성 — 토큰 투표·예약</label>

  $('#memName').addEventListener('keydown', e => { if (e.key === 'Enter') saveMemberFromEditor(id); });

}
async function saveMemberFromEditor(id) {
  const m = id ? S.members[id] : null;
  const name = $('#memName').value.trim().replace(/\s+/g, ' ');
  const slackId = $('#memSlack').value.trim().toUpperCase();
  const active = $('#memSynth').checked, opticsActive = $('#memOptics').checked, isAdmin = $('#memAdmin').checked;
  if (!name) return toast('이름을 입력하세요.', 'err');
  if (name.length > 40) return toast('이름은 40자 이내로 입력하세요.', 'err');
  const dup = Object.values(S.members).find(x => x.id !== id && x.name.trim() === name);
  if (dup) return toast(`'${name}' 이름이 이미 있습니다${dup.hidden ? ' (삭제한 멤버 목록에서 되살릴 수 있습니다)' : ''}.`, 'err');
  if (slackId && !MEMBER_SLACK_RE.test(slackId)) return toast('Slack 멤버 ID 형식이 아닙니다 (U로 시작하는 영문·숫자). Slack 프로필 → ⋮ → 멤버 ID 복사.', 'err');
  const dupS = slackId && Object.values(S.members).find(x => x.id !== id && !x.hidden && (x.slackId || '') === slackId);
  if (dupS) return toast(`이 Slack ID는 이미 ${dupS.name}에게 등록돼 있습니다.`, 'err');
  if (isAdmin && !active && !opticsActive) return toast('관리자는 합성·광학 중 하나 이상 참여해야 로그인할 수 있습니다.', 'err');
  if (m) {
    const isSelf = id === S.user?.id;
    if (isSelf && !isAdmin) return toast('본인의 관리자 권한은 해제할 수 없습니다. (잠금 방지)', 'err');
    if (isSelf && !active && !opticsActive) return toast('본인 계정의 참여를 모두 끌 수는 없습니다. (잠금 방지)', 'err');
    if (m.isAdmin && !isAdmin && memAdminCount(id) === 0) return toast('마지막 관리자입니다. 먼저 다른 멤버를 관리자로 지정하세요.', 'err');
    if (name !== m.name && !slackId && !confirm(`이름을 '${m.name}' → '${name}'(으)로 바꿉니다.\n\nSlack ID가 비어 있으면 봇의 이름 기준 태그가 끊길 수 있습니다. 그래도 저장할까요?`)) return;
  }
  const patch = { name, slackId, active, opticsActive, isAdmin };
  try {
    await store.admin.saveMember(id || null, patch);
    closeModal();
    toast(m ? `${name} 정보를 저장했습니다.` : `${name}을(를) 명단에 추가했습니다.`, 'okk');
  } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
}
function bindMemberAdmin() {
  document.querySelectorAll('[data-mem]').forEach(b => b.addEventListener('click', async () => {
    const act = b.dataset.mem, id = b.dataset.id, m = id ? S.members[id] : null, A = store.admin;
    const isSelf = id && id === S.user?.id;
    try {
      if (act === 'add') return openMemberEditor(null);
      if (act === 'edit') return openMemberEditor(id);
      if (act === 'pin' && confirm(`${m.name}의 PIN을 초기화할까요? 다음 로그인 때 새 PIN을 등록합니다.`)) { await A.resetPin(id); toast('PIN을 초기화했습니다.', 'okk'); }
      if (act === 'dev' && confirm(`${m.name}의 연결 기기를 모두 해제할까요? 다음 로그인 때 PIN으로 다시 연결합니다.`)) { await A.resetDevices(id); toast('기기 연결을 해제했습니다.', 'okk'); }
      if (act === 'hide') {
        if (isSelf) return toast('본인 계정은 삭제할 수 없습니다. (잠금 방지)', 'err');
        if (m.isAdmin) return toast('관리자는 바로 삭제할 수 없습니다. «편집»에서 관리자를 해제한 뒤 삭제하세요.', 'err');
        if (!confirm(`${m.name}을(를) 명단에서 삭제할까요?\n\n· 명단·로그인·투표·예약 대상에서 빠지고 연결 기기가 해제됩니다.\n· 과거 배정·예약·기록의 이름은 그대로 남습니다.\n· «삭제한 멤버»에서 언제든 되살릴 수 있습니다.`)) return;
        await A.saveMember(id, { hidden: true, active: false, opticsActive: false, uids: [] });
        toast(`${m.name}을(를) 삭제했습니다. (되살리기 가능)`, 'okk');
      }
      if (act === 'restore') {
        await A.saveMember(id, { hidden: false });
        toast(`${m.name}을(를) 되살렸습니다. 참여할 앱을 켜 주세요.`, 'okk');
        openMemberEditor(id);
      }
    } catch (e) { toast(e.message, 'err'); }
  }));
}

  const rows = ms.map(m => `<tr>

    <td>${m.opticsActive === true ? '<span class="badge b-green">광학 활성</span>' : '<span class="badge b-gray">광학 비활성</span>'}</td>
    <td>${m.active === true ? '<span class="badge b-accent">합성 활성</span>' : '<span class="badge b-gray">합성 비활성</span>'}</td>
    <td>${m.pinHash ? '<span class="badge b-green">등록 완료</span>' : '<span class="badge b-amber">미등록</span>'}</td></tr>`).join('');
  return `<div class="card"><h2>명단 (광학 활성 ${ms.filter(m => m.opticsActive === true).length}명)</h2>
    <p class="muted" style="margin-bottom:8px">명단·PIN·기기 인증은 Synthesis Scheduler와 공유되며, 광학/합성 활성 여부는 별도로 관리됩니다. 광학 활성 멤버만 사전 투표·일정 수정·채팅·변경사항 기록이 가능합니다.</p>
    <table class="list"><tr><th>이름</th><th>광학</th><th>합성</th><th>계정</th></tr>${rows}</table></div>`;
}

function renderRulesEn() {

    <li><b>Thu 12:00</b> — Day assignments are announced automatically + Slack notice. Then <b>open coordination for everyone</b> begins.</li>
    <li>Coordination (editing the schedule) remains possible from the announcement <b>until 24:00 Sunday of that week</b>.</li>
  </ul>

  <h3>2. How voting works</h3>
  <ul>
    <li>Each person votes for <b>1st / 2nd / 3rd choice days</b> (you don't have to fill all three; the same day can't be picked twice).</li>
    <li><b>You can choose only the time blocks you need on each day</b> — a day is split into 4 blocks: <b>Dawn (00-06) / Morning (06-12) / Afternoon (12-18) / Evening (18-24)</b>. Tap the day name for <b>All day</b>, or a block chip for <b>that block only</b>. No need to take time you don't need and cancel it later.</li>
    <li>Fewer votes give you an edge in same-rank ties (criterion ③ below). The length of the blocks you apply for <b>does not affect</b> the competition — applying for less time is neither an advantage nor a disadvantage.</li>
  </ul>

  <h3>3. Day assignment criteria (Thu 12:00, applied in this order)</h3>
  <ul>
    <li>① <b>No-win members first, absolutely</b> — someone who has not yet been assigned any day this week beats anyone already assigned, regardless of rank.</li>
    <li>② <b>Higher rank</b> for that day wins.</li>
    <li>③ On equal rank, the person with <b>fewer total votes</b> wins (they need it more).</li>
    <li>④ If still tied, a <b>seeded random draw</b> (seed = SHA-256 of all closed votes → impossible to manipulate or predict; everyone re-verifies).</li>
    <li>Days are processed Mon→Sun, and wins count immediately toward later days. Without competition, one person can be assigned several days.</li>
    <li><b>The main winner takes only the blocks they applied for</b> (the whole day if they applied for all day).</li>
    <li><b>Filling leftover blocks</b>: if <b>another applicant's requested blocks fit entirely</b> into the blocks the main winner left unused, that person is also assigned, using the same criteria (①–④). This repeats until nobody else fits. <b>Partial overlaps are not inserted</b> (requests are never split to squeeze someone in).<br>
        e.g. A = Dawn+Morning, B = Afternoon+Evening, C = Morning+Afternoon compete for the same day at the same rank →
        <b>if C is the main winner</b>, only Dawn and Evening remain, nobody fits whole, so C alone;
        <b>if A is the main winner</b>, Afternoon+Evening are free, B fits exactly, so both A and B are assigned.</li>
    <li>A leftover-block assignment also <b>counts as one win</b>, so that person yields to no-win members on other days that week (① works on actual chances to use the equipment).</li>
    <li>Blocks nobody applied for stay <b>empty</b> and anyone can use them through open coordination.</li>
  </ul>

  <h3>4. Open coordination (after the announcement)</h3>
  <ul>

    <li><b>📱 On mobile</b>: <b>swipe up/down inside a day column to select a time range</b> (the page won't scroll), and <b>swipe left/right to see other days</b>. <b>To scroll the page, swipe on the time ruler at the left or outside the table</b>. For a range too long to fit on one screen, <b>select it in two parts</b> — they merge into one continuous block.</li>
    <li>Use the <b>Show preferences toggle</b> on the Schedule and Live booking tabs to see everyone's 1st/2nd/3rd choices semi-transparently — useful when coordinating.</li>
    <li>Changes reach the shared Google Calendar within 1 minute. <b>Do not edit the calendar directly</b> (it will be reverted automatically).</li>

  <h3>5. Admin blocks (Repair / External visit)</h3>
  <ul>
    <li>Events that require the whole lab to step aside, such as equipment <b>Repair</b> or an <b>External visit</b> measurement, can be registered <b>only by admin accounts</b>. The schedule shows the <b>reason (+ optional memo)</b> with a 🔒 mark instead of a person's name.</li>
    <li>To register: click or drag cells on the calendar in the «Schedule» or «Live booking» tab → choose a 🔒 item as the assignee. <b>Possible even during voting or before the announcement</b>, for this week and next week.</li>

    <li><b>Editing / removing (admin)</b>: click or drag a registered block again and it opens with its current type and memo filled in — change them and press «Apply» to update; choose "🔓 Remove admin block" to return to the original assignment; choose a member's name or «Clear» to remove the block and change the assignment together after confirmation. To shrink a block, drag only the part to remove. Blocks can also be removed one by one from the «Admin blocks» list on the Admin tab.</li>
    <li>They are added to Google Calendar automatically as <b>[Optics] Repair</b> / <b>[Optics] External visit</b> (synced within 1 minute).</li>
  </ul>

  <h3>6. Hardware Log is mandatory</h3>
  <ul>
    <li>Check the status board before you start measuring, and log any configuration change immediately (LASER controller / turret align, turret mirror, SNSPD channels and the 3 connections, power meter).</li>
    <li><b style="color:var(--red)">ND / pinhole / filter and other add-ons must be removed after use and the setup restored</b> (they aren't tracked on the status board, and the rule is not to leave them in place).</li>
    <li>Saving records the change, date/time (day) and user in the history, and posts it to the Slack channel within 1 minute.</li>
  </ul>

  <h3>7. Remarks</h3>
  <ul>
    <li>Record anything to share about measurements, equipment or the lab in the <b>Remarks tab</b> (date and name are recorded automatically; only the latest 10 are kept — older ones are deleted automatically).</li>
  </ul>

  <h3>8. System and fairness guarantees</h3>
  <ul>
    <li>Deadlines, identity checks (PIN + device) and vote format are enforced by server security rules — they can't be bypassed by tampering with the browser.</li>
    <li>Assignment results can't be modified after creation, and every visitor re-computes and verifies them (badge on the results tab).</li>
    <li>The roster and PINs are shared with Synthesis Scheduler. Optics participation (activation) is managed separately by admins.</li>
  </ul>
  </div>`;
}

    <li><b>목 12:00</b> — 요일 배정 자동 발표 + Slack 공지. 이후 <b>전원 자유 조율</b> 시작.</li>

    <li>마감시각·본인확인(PIN+기기)·투표 형식은 서버 보안규칙이 강제 — 브라우저 조작으로 우회 불가.</li>
    <li>배정 결과는 생성 후 수정 불가, 모든 접속자가 재계산 검증 (결과 탭 배지).</li>
    <li>명단·PIN은 Synthesis Scheduler와 공유. 광학 참여 여부(활성화)는 관리자가 별도 관리.</li>
  </ul>

/* 관리자 지정 일정(Repair / 외부인 방문측정) 등록·해제 패널 */
function renderAdminBlocksPanel(c) {
  const weeks = [{ w: c.votingWeek, label: '이번 주' }, { w: c.targetWeek, label: '다음 주' }];
  const lists = weeks.map(({ w, label }) => {
    const adm = w === c.targetWeek ? S.adm : S.curAdm;
    const rows = [];
    for (let d = 0; d < 7; d++) {
      optAdminBlocksOfDay(adm, d).forEach(b => {
        rows.push(`<tr>
          <td>${OPT_DAYS[d]} (${fmtDate(optDayDate(w, d))})</td>
          <td><span class="badge b-red">${esc(optAdminLabel(b.owner))}</span></td>
          <td>${optRangeLabel(b.start, b.end)}</td>
          <td><button class="btn sm danger" data-admdel="${w}|${d}|${b.start}|${b.end}">해제</button></td></tr>`);
      });
    }
    return `<h3 style="margin-bottom:6px">${label} (${weekLabel(w)})</h3>` + (rows.length
      ? `<table class="list"><tr><th>날짜</th><th>사유</th><th>시간</th><th>조치</th></tr>${rows.join('')}</table>`
      : '<p class="muted">등록된 관리자 지정 일정이 없습니다.</p>');
  }).join('');
  return `<div class="card"><h2>관리자 지정 일정 (Repair / 외부인 방문측정)</h2>
    <p class="muted" style="margin-bottom:10px">
      <b>등록</b>: «일정» 또는 «실시간 예약» 탭의 캘린더에서 칸을 클릭·드래그 → 배정 대상에서 🔒 Repair / 🔒 외부인 방문측정 선택 (메모 선택 입력).
      투표 기간·발표 전에도 등록할 수 있으며, 등록 즉시 사전 투표 화면·실시간 예약 화면·구글캘린더에 반영됩니다.<br>
      <b>수정</b>: 같은 방식으로 그 구간을 다시 클릭·드래그하면 현재 종류·메모가 채워진 상태로 열립니다 — 바꿔서 «적용»하면 갱신,
      🔓 «관리자 지정 해제»를 고르면 원래 배정으로 복귀, 멤버 이름이나 «비우기»를 고르면 확인 후 지정 해제와 배정 변경이 함께 처리됩니다.
      구간을 줄이려면 줄이려는 부분만 드래그해 해제하면 됩니다. 아래 표의 «해제» 버튼으로도 구간 단위 해제가 가능합니다.<br>
      이 블록은 <b>요일 당첨자와 자유 조율 결과를 모두 덮으므로</b>, 당첨자는 블록을 제외한 나머지 시간만 사용하게 됩니다.
      대상 주는 이번 주·다음 주로 제한됩니다(서버 규칙).</p>
    ${lists}</div>`;
}

function openLogin() {
  const list = Object.values(S.members).filter(m => !m.hidden && (m.opticsActive === true || m.isAdmin));
  if (!list.length) {
    showModal(`<h2>멤버 없음</h2><p class="muted">아직 광학 활성 멤버가 없습니다. Synthesis Scheduler에서 관리자로 로그인한 뒤, 이 앱의 관리자 탭에서 멤버들의 "광학 활성화"를 켜주세요. (명단·PIN 공유)</p>
      <div class="flexrow"><button class="btn" data-close>닫기</button></div>`);
    return;
  }
  const opts = list.sort((a, b) => a.name.localeCompare(b.name, 'ko'))
    .map(m => `<option value="${m.id}">${esc(m.name)}${m.pinHash ? '' : ' (첫 로그인)'}</option>`).join('');
  showModal(`
    <h2>멤버 로그인</h2>
    <p class="muted" style="margin-bottom:10px">Synthesis Scheduler와 같은 계정(이름+PIN)입니다.</p>
    <div class="field"><label>이름</label><select id="loginMember">${opts}</select></div>
    <div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric"></div>

    <p class="muted" style="margin-top:10px">⚠ 첫 로그인 시 입력한 PIN이 그대로 등록되니 신중히 입력하세요. PIN 분실 시 관리자에게 초기화를 요청하세요.</p>`);
  $('#btnDoLogin').addEventListener('click', async () => {
    const id = $('#loginMember').value, pin = $('#loginPin').value.trim();

    try { await store.claim(id, pin); closeModal(); toast(`${memberName(id)}님, 환영합니다!`, 'okk'); }

function showModal(html) {
