<style>
  /* INNO suite — 공통 틀 + Scheduler 강조색 */
  :root{--page:#f5f6f3;--surface:#ffffff;--surface-2:#eef1ed;--surface-3:#e6eae5;--ink:#243433;--ink-2:#4a5a56;--muted:#62706b;--faint:#8b978f;--border:#dde3dc;--border-strong:#c9d3c8;--grid:#e4e8e2;--ok:#2a7141;--ok-soft:#e3f0e5;--warn:#8a5f0a;--warn-soft:#f7ecd3;--risk:#ab3f35;--risk-soft:#f6e1dd;--info:#2f5f9e;--info-soft:#e2eaf5;--scrim:rgba(20,32,30,.42);--shadow:0 1px 2px rgba(24,40,37,.05),0 6px 20px rgba(24,40,37,.06);--shadow-lg:0 24px 70px rgba(24,40,37,.18);--accent:#2b5f8e;--accent-strong:#214b71;--accent-soft:#e3ebf4;--focus:#5b88b4;--chrome:#1a2e42;--chrome-mark:#a9c7e5;--font:"DM Sans","Noto Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;--chrome-ink:#f1f4ef;--chrome-ink-2:rgba(241,244,239,.72)}

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .band { background: var(--chrome); color: var(--chrome-ink); padding: 56px 20px 92px; text-align: center; }
  .band h1 { font-size: 26px; font-weight: 700; letter-spacing: .01em; margin-bottom: 8px; }
  .band h1 em { font-style: normal; color: var(--chrome-mark); }
  p.sub { color: var(--chrome-ink-2); font-size: 14px; }
  .wrap { max-width: 600px; margin: -60px auto 40px; padding: 0 20px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
  a.card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
           padding: 28px 18px; text-decoration: none; color: var(--ink); text-align: center;
           box-shadow: var(--shadow-lg); transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  a.card .emoji { font-size: 32px; display: block; margin-bottom: 10px; }
  a.card b { font-size: 16.5px; font-weight: 600; display: block; margin-bottom: 4px; }
  a.card span { font-size: 12.5px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
</style>
